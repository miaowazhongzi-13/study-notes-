<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F7F5F0" id="meta-theme">
<title>学习笔记</title>
<!-- 主题要在样式生效前定好，否则深色下打开会先白闪一下 -->
<script>
(function(){
  try{
    var pref = localStorage.getItem('wb_theme') || 'auto';
    var dark = pref === 'dark' ||
      (pref === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    if (dark) document.documentElement.setAttribute('data-theme', 'dark');
  }catch(e){}
})();
</script>
<link rel="manifest" href="manifest.json?sharecode=6FVT4AIQ2N">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?sharecode=6FVT4AIQ2N">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?sharecode=6FVT4AIQ2N">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="学习笔记">
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root{
    --paper:#F7F5F0;
    --card:#FFFFFF;
    --ink:#1B1A17;
    --ink2:#57544D;
    --muted:#9C978D;
    --line:#E9E5DB;
    --accent:#C0492F;
    --accent-soft:rgba(192,73,47,.09);
    --num:Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --pad:22px;
  }
  html,body{ margin:0; height:100%; }
  body{
    font-family:var(--sans); color:var(--ink);
    background:radial-gradient(circle at 50% -10%, #F8F5EE 0%, #E3DFD5 100%);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }

  .phone{
    position:relative;
    width:390px; height:min(844px, 94vh);
    background:var(--paper);
    border-radius:48px;
    box-shadow:0 0 0 11px #16161a, 0 0 0 13px #3c3c41, 0 44px 90px -24px rgba(35,28,20,.5);
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  @media (max-width:460px){
    body{ background:var(--paper); }
    .phone{ width:100vw; height:100vh; height:100dvh; border-radius:0; box-shadow:none; }
    .island{ display:none; }
  }
  .island{
    position:absolute; top:11px; left:50%; transform:translateX(-50%);
    width:108px; height:29px; background:#0E0E12; border-radius:20px; z-index:60;
  }
  .statusbar{
    flex:none; height:50px; padding:0 28px 0 32px;
    display:flex; align-items:center; justify-content:space-between;
    font-size:14px; font-weight:600; letter-spacing:.2px;
    position:relative; z-index:61;
  }
  .sb-icons{ display:flex; align-items:center; gap:6px; }
  .home-bar{
    position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
    width:132px; height:5px; border-radius:3px; background:rgba(0,0,0,.18); z-index:61;
  }

  .stage{ position:relative; flex:1; overflow:hidden; }
  .screen{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    background:var(--paper);
    transform:translateX(100%);
    opacity:0; pointer-events:none;
    transition:transform .34s cubic-bezier(.32,.72,0,1), opacity .28s ease;
    will-change:transform;
  }
  .screen.active{ transform:translateX(0); opacity:1; pointer-events:auto; }
  .screen.exit-left{ transform:translateX(-26%); opacity:0; }

  .scroll{
    flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:4px var(--pad) 118px;
    scrollbar-width:none;
  }
  .scroll::-webkit-scrollbar{ display:none; }

  .hd{ flex:none; padding:8px var(--pad) 12px; }
  .h1{ margin:0; font-size:31px; font-weight:700; letter-spacing:-.8px; }
  .h2{ margin:0; font-size:22px; font-weight:700; letter-spacing:-.4px; }
  .sub{ margin:7px 0 0; font-size:12.5px; color:var(--muted); }

  .hd-nav{ display:flex; align-items:center; gap:13px; padding-top:6px; }
  .nav-title{ flex:1; min-width:0; }
  .nav-extra{ display:flex; gap:6px; align-items:center; }
  .back{
    flex:none; width:38px; height:38px; border-radius:50%;
    border:1px solid var(--line); background:var(--card); color:var(--ink);
    display:grid; place-items:center; cursor:pointer;
    transition:transform .15s, background .15s;
  }
  .back:active{ transform:scale(.92); background:#F1EEE7; }
  .arrow{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--line);
    background:var(--card); color:var(--ink2); font-size:17px;
    display:grid; place-items:center; cursor:pointer;
  }
  .arrow:active{ transform:scale(.9); }
  .arrow:disabled{ opacity:.3; cursor:default; }

  .seg{
    display:inline-flex; gap:2px; margin-top:14px;
    background:#ECE8DF; border-radius:999px; padding:3px;
  }
  .seg-btn{
    border:none; background:transparent; cursor:pointer;
    font-family:inherit; font-size:12.5px; font-weight:600;
    color:var(--muted); padding:6px 16px; border-radius:999px;
    transition:background .2s, color .2s, box-shadow .2s;
  }
  .seg-btn.on{ background:var(--card); color:var(--ink); box-shadow:0 1px 3px rgba(30,25,20,.1); }

  .year-list{ display:flex; flex-direction:column; gap:12px; padding-top:4px; }
  .year-card{
    display:block; width:100%; text-align:left; cursor:pointer;
    background:var(--card); border:1px solid var(--line); border-radius:20px;
    padding:18px 20px 16px; font-family:inherit; color:var(--ink);
    transition:transform .18s cubic-bezier(.3,.8,.4,1);
  }
  .year-card:active{ transform:scale(.978); }
  .year-card.current{
    background:#1B1A17; border-color:#1B1A17; color:#F7F5F0;
    box-shadow:0 16px 34px -16px rgba(27,26,23,.6);
  }
  .yc-top{ display:flex; align-items:baseline; justify-content:space-between; }
  .yc-num{ font-family:var(--num); font-size:40px; letter-spacing:-1px; line-height:1; }
  .yc-meta{ display:flex; align-items:center; gap:7px; font-size:12px; opacity:.62; }
  .yc-bars{ display:flex; align-items:flex-end; gap:3px; height:18px; margin-top:15px; }
  .yc-bars i{ flex:1; border-radius:1.5px; background:currentColor; opacity:.16; min-height:2px; }

  /* ---------- 文件夹 ---------- */
  .crumb{
    display:flex; align-items:center; gap:5px; flex-wrap:wrap;
    font-size:11.5px; color:var(--muted);
  }
  .crumb span{ cursor:pointer; }
  .crumb span.cur{ color:var(--ink); font-weight:600; cursor:default; }
  .crumb i{ font-style:normal; opacity:.5; }
  .folder-bar{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .folder-bar .crumb{ flex:1; margin:0; }
  .folder-bar .txt-btn{
    flex:none; border:1px solid var(--line); background:var(--card); color:var(--ink2);
    font-family:inherit; font-size:11.5px; padding:5px 11px; border-radius:999px; cursor:pointer;
  }
  .folder-bar .txt-btn.on{ background:#1B1A17; border-color:#1B1A17; color:#F7F5F0; }

  .folder-grid{ display:grid; grid-template-columns:1fr 1fr; gap:11px; }
  .folder-card{
    position:relative; text-align:left; cursor:pointer;
    background:var(--card); border:1px solid var(--line); border-radius:19px;
    padding:15px 15px 14px;
    transition:transform .18s cubic-bezier(.3,.8,.4,1);
  }
  .folder-card:active{ transform:scale(.965); }
  .folder-card .fc-ico{ display:block; width:26px; height:22px; margin-bottom:9px; position:relative; }
  .folder-card .fc-ico::before{
    content:""; position:absolute; left:0; top:0; width:12px; height:6px;
    border-radius:3px 3px 0 0; background:rgba(192,73,47,.45);
  }
  .folder-card .fc-ico::after{
    content:""; position:absolute; left:0; top:4px; width:26px; height:18px;
    border-radius:3px 5px 5px 5px; background:rgba(192,73,47,.16);
    border:1px solid rgba(192,73,47,.26);
  }
  .folder-card .fc-name{
    font-size:14.5px; font-weight:600; letter-spacing:-.2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    padding-right:2px;
  }
  .folder-card .fc-meta{ margin-top:5px; font-size:10.5px; color:var(--muted); }
  .folder-card .fc-del, .folder-card .fc-edit{
    position:absolute; top:8px; width:23px; height:23px;
    border-radius:50%; border:none; cursor:pointer; display:none;
    place-items:center; font-size:12px; line-height:1; padding:0;
    background:rgba(27,26,23,.07); color:var(--ink2); font-family:inherit;
  }
  .folder-card .fc-edit{ right:36px; }
  .folder-card .fc-del{ right:8px; }
  .folder-grid.editing .folder-card .fc-del,
  .folder-grid.editing .folder-card .fc-edit{ display:grid; }

  .folder-new{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:5px; min-height:100px; cursor:pointer;
    background:transparent; border:1.5px dashed #DCD7CB; border-radius:19px;
    color:var(--muted); font-family:inherit; font-size:12.5px;
  }
  .folder-new:active{ background:rgba(0,0,0,.02); }
  .folder-new b{ font-size:19px; font-weight:300; line-height:1; }

  .section-lbl{
    margin:20px 0 10px; font-size:11px; font-weight:600;
    letter-spacing:.18em; color:var(--muted);
  }

  /* ---------- 月份 ---------- */
  .month-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:11px; padding-top:4px; }
  .month-cell{
    border:1px solid var(--line); border-radius:19px;
    background:var(--card); padding:16px 12px 14px;
    display:flex; flex-direction:column; align-items:center; gap:5px;
    cursor:pointer; font-family:inherit; color:var(--ink);
    transition:transform .18s cubic-bezier(.3,.8,.4,1);
  }
  .month-cell:active{ transform:scale(.955); }
  .month-cell .m-num{ font-family:var(--num); font-size:25px; line-height:1; letter-spacing:-.5px; }
  .month-cell .m-unit{ font-size:10px; color:var(--muted); margin-left:1px; font-family:var(--sans); }
  .month-cell .m-cnt{ font-size:10.5px; color:var(--muted); }
  .month-cell.empty .m-num{ color:#C8C3B8; }
  .month-cell.cur{ border-color:#1B1A17; }
  .month-cell.cur .m-num::after{
    content:""; display:block; width:4px; height:4px; border-radius:50%;
    background:var(--accent); margin:5px auto 0;
  }

  /* ---------- 日历 ---------- */
  .week-head{
    display:grid; grid-template-columns:repeat(7,1fr);
    margin:2px 0 8px; font-size:11px; color:var(--muted); text-align:center;
  }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .day-cell{
    aspect-ratio:1/1.14; border-radius:12px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:4px; cursor:pointer; border:1px solid transparent;
    transition:transform .14s;
  }
  .day-cell:active{ transform:scale(.9); }
  .d-num{
    font-family:var(--num); font-size:15.5px; line-height:1;
    width:30px; height:30px; display:grid; place-items:center; border-radius:50%;
  }
  .d-dot{ width:4px; height:4px; border-radius:50%; background:var(--accent); }
  .day-cell.has{ background:rgba(192,73,47,.055); }
  .day-cell.blank{ visibility:hidden; }
  .day-cell.today .d-num{ background:#1B1A17; color:var(--paper); font-weight:600; }
  .day-cell.today .d-dot{ background:#1B1A17; }
  .day-cell.multi .d-dot{ box-shadow:5px 0 0 -1px var(--accent); margin-right:5px; }
  .cal-foot{ margin:22px 0 0; font-size:12px; color:var(--muted); text-align:center; }

  /* ---------- 笔记卡片 ---------- */
  .note-card{
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    padding:16px 18px 17px; margin-bottom:11px; cursor:pointer;
    animation:rise .38s cubic-bezier(.3,.85,.4,1) both;
  }
  @keyframes rise{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }
  .nc-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:9px; }
  .nc-time{ font-family:var(--num); font-size:11.5px; color:var(--muted); }
  .nc-tag{
    font-size:10.5px; color:var(--accent); background:var(--accent-soft);
    padding:3px 9px; border-radius:999px; white-space:nowrap;
    max-width:150px; overflow:hidden; text-overflow:ellipsis;
  }
  .nc-title{ margin:0 0 8px; font-size:15.5px; font-weight:600; letter-spacing:-.2px; }

  .rich-body{ color:var(--ink2); line-height:1.75; word-break:break-word; }
  .rich-body p{ margin:0 0 .6em; }
  .rich-body p:last-child{ margin-bottom:0; }
  .rich-body h1,.rich-body h2,.rich-body h3{
    margin:.75em 0 .4em; color:var(--ink); font-weight:700; line-height:1.35;
  }
  .rich-body h1:first-child,.rich-body h2:first-child,.rich-body h3:first-child{ margin-top:0; }
  .rich-body h1{ font-size:1.55em; letter-spacing:-.4px; }
  .rich-body h2{ font-size:1.28em; letter-spacing:-.3px; }
  .rich-body h3{ font-size:1.1em; letter-spacing:-.2px; }
  .rich-body img{
    max-width:100%; height:auto; border-radius:10px; display:block;
    margin:.6em 0; border:1px solid var(--line); cursor:zoom-in;
  }
  .rich-body ul,.rich-body ol{ margin:.4em 0 .6em; padding-left:1.4em; }
  .rich-body li{ margin:.2em 0; }
  .rich-body b,.rich-body strong{ font-weight:700; color:var(--ink); }

  .list-item{
    background:var(--card); border:1px solid var(--line); border-radius:17px;
    padding:14px 16px; margin-bottom:10px; cursor:pointer;
    animation:rise .36s cubic-bezier(.3,.85,.4,1) both;
  }
  .li-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; }
  .li-date{ font-family:var(--num); font-size:11.5px; color:var(--muted); }
  .li-chap{ font-size:10.5px; color:var(--accent); background:var(--accent-soft); padding:2px 8px; border-radius:999px; }
  .li-title{ margin:0; font-size:14.5px; font-weight:600; letter-spacing:-.15px; }
  .li-body{
    margin:5px 0 0; font-size:12px; line-height:1.6; color:var(--muted);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }

  .empty-state{ text-align:center; padding:44px 20px; }
  .empty-state .es-mark{
    width:56px; height:56px; margin:0 auto 16px; border-radius:50%;
    border:1.5px dashed #D6D1C6; display:grid; place-items:center;
    font-size:22px; color:#C6C1B6; font-family:var(--num);
  }
  .empty-state p{ margin:0; font-size:13px; color:var(--muted); }

  /* ---------- dock ---------- */
  .dock{
    position:absolute; left:var(--pad); right:var(--pad); bottom:36px;
    display:flex; align-items:center; justify-content:space-between;
    z-index:40; pointer-events:none;
  }
  .dock > *{ pointer-events:auto; }
  .dock-add{
    width:54px; height:54px; border-radius:50%;
    background:var(--card); border:1px solid #E0DBD0; color:var(--ink);
    font-size:27px; font-weight:300; line-height:1;
    display:grid; place-items:center; cursor:pointer; padding:0 0 2px;
    box-shadow:0 10px 26px -10px rgba(35,28,20,.34);
    transition:transform .16s;
  }
  .dock-add:active{ transform:scale(.9); background:#F1EEE7; }
  .dock-cont{
    width:54px; height:54px; border-radius:50%; border:none; cursor:pointer;
    background:#1B1A17; color:#F7F5F0; display:grid; place-items:center;
    box-shadow:0 12px 30px -10px rgba(27,26,23,.6);
    transition:transform .16s;
  }
  .dock-cont svg{ margin-left:3px; }
  .dock-cont:active{ transform:scale(.9); }

  /* ============================================================
     编辑器
     ============================================================ */
  .ed{
    position:absolute; inset:0; z-index:90;
    background:var(--paper); padding-top:50px;
    display:flex; flex-direction:column;
    transform:translateY(100%);
    transition:transform .4s cubic-bezier(.32,.72,0,1);
  }
  .ed.on{ transform:translateY(0); }
  .ed-head{
    flex:none; height:54px; padding:0 16px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    border-bottom:1px solid var(--line);
  }
  .ed-head .ed-t{ font-size:13px; font-weight:600; }
  .ed-cancel, .ed-save{
    border:none; background:transparent; cursor:pointer;
    font-family:inherit; font-size:13.5px; padding:6px 2px; white-space:nowrap;
  }
  .ed-cancel{ color:var(--muted); }
  .ed-save{ color:var(--ink); font-weight:600; }
  .ed-save:disabled{ color:#C8C3B8; cursor:default; }

  .ed-body{ flex:1; overflow-y:auto; padding:12px 18px 20px; scrollbar-width:none; }
  .ed-body::-webkit-scrollbar{ display:none; }

  .ed-folder{
    display:flex; align-items:center; gap:8px; margin-bottom:14px;
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:9px 13px; cursor:pointer;
  }
  .ed-folder .ef-ico{ color:var(--accent); font-size:12px; }
  .ed-folder .ef-path{
    flex:1; min-width:0; font-size:12px; color:var(--ink2);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .ed-folder .ef-act{ font-size:11px; color:var(--muted); flex:none; }

  .ed-inp{
    width:100%; border:none; background:transparent; outline:none;
    font-family:var(--sans); font-size:19px; font-weight:600; letter-spacing:-.3px;
    color:var(--ink); padding:2px 0 10px;
  }
  .ed-inp::placeholder{ color:#C6C1B6; }

  .ed-rich{
    width:100%; min-height:200px; outline:none;
    font-family:var(--sans); font-size:15px; line-height:1.78; color:var(--ink2);
    word-break:break-word; -webkit-user-select:text; user-select:text;
  }
  .ed-rich:empty::before{ content:attr(data-ph); color:#C6C1B6; pointer-events:none; }
  .ed-rich p{ margin:0 0 .6em; }
  .ed-rich h1{ font-size:1.55em; margin:.7em 0 .35em; color:var(--ink); line-height:1.35; }
  .ed-rich h2{ font-size:1.28em; margin:.7em 0 .35em; color:var(--ink); line-height:1.35; }
  .ed-rich h3{ font-size:1.1em; margin:.7em 0 .35em; color:var(--ink); line-height:1.35; }
  .ed-rich h1:first-child,.ed-rich h2:first-child,.ed-rich h3:first-child{ margin-top:0; }
  .ed-rich ul,.ed-rich ol{ margin:.3em 0 .7em; padding-left:1.4em; }
  .ed-rich img{
    max-width:100%; height:auto; border-radius:10px; display:block;
    margin:.6em 0; border:1px solid var(--line);
  }
  .ed-rich b,.ed-rich strong{ color:var(--ink); }

  .ed-tools{
    flex:none; border-top:1px solid var(--line);
    padding:8px 12px 14px; background:var(--paper);
    display:flex; flex-direction:column; gap:6px;
  }
  .tb-row{ display:flex; align-items:center; gap:5px; }
  .tb{
    flex:none; height:32px; min-width:32px; padding:0 9px;
    border-radius:9px; border:1px solid var(--line); background:var(--card);
    color:var(--ink2); font-family:inherit; font-size:12px; cursor:pointer;
    display:grid; place-items:center;
    transition:transform .13s, background .15s;
  }
  .tb:active{ transform:scale(.93); background:#F1EEE7; }
  .tb.on{ background:#1B1A17; border-color:#1B1A17; color:#F7F5F0; }
  .tb b{ font-weight:800; font-size:13px; }
  .tb i{ font-style:italic; font-family:var(--num); font-size:13px; }
  .tb u{ text-underline-offset:1px; font-size:13px; }
  .tb-sep{ flex:1; }
  .cw{
    flex:none; width:26px; height:26px; border-radius:50%;
    border:2px solid transparent; cursor:pointer; padding:0;
    transition:transform .14s, border-color .14s;
  }
  .cw.on{ border-color:#1B1A17; transform:scale(1.08); }

  /* ============================================================
     底部弹层
     ============================================================ */
  .sheet-mask{
    position:absolute; inset:0; z-index:130;
    background:rgba(22,18,14,.3);
    opacity:0; pointer-events:none; transition:opacity .28s;
  }
  .sheet-mask.on{ opacity:1; pointer-events:auto; }

  .sheet{
    position:absolute; left:0; right:0; bottom:0; z-index:140;
    background:var(--paper);
    border-radius:26px 26px 0 0;
    padding:8px 20px 26px;
    max-height:76%; display:flex; flex-direction:column;
    transform:translateY(104%);
    transition:transform .38s cubic-bezier(.32,.72,0,1);
    box-shadow:0 -14px 44px -22px rgba(30,25,20,.45);
  }
  .sheet.on{ transform:translateY(0); }
  .sheet-handle{ width:36px; height:4px; border-radius:2px; background:#DCD6CA; margin:4px auto 14px; flex:none; }
  .sheet-head{ flex:none; display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px; }
  .sheet-head h3{ margin:0; font-size:16px; font-weight:700; }
  .sheet-head span{ font-size:11.5px; color:var(--muted); }
  .sheet-list{ flex:1; overflow-y:auto; scrollbar-width:none; }
  .sheet-list::-webkit-scrollbar{ display:none; }

  .fo-row{
    display:flex; align-items:center; gap:8px; width:100%; text-align:left;
    border:none; background:transparent; font-family:inherit; cursor:pointer;
    padding:11px 10px; border-radius:11px; color:var(--ink); font-size:13.5px;
  }
  .fo-row:active{ background:rgba(0,0,0,.04); }
  .fo-row.on{ background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .fo-row .fo-ind{ color:#CFC9BD; font-size:11px; flex:none; }

  .inp-sheet{ display:flex; gap:8px; }
  .inp-sheet input{
    flex:1; border:1px solid var(--line); background:var(--card);
    border-radius:12px; padding:12px 14px; font-family:inherit;
    font-size:14px; color:var(--ink); outline:none;
  }
  .inp-sheet input:focus{ border-color:#C7C1B3; }
  .inp-sheet button{
    flex:none; padding:0 18px; border-radius:12px; border:none;
    background:#1B1A17; color:#F7F5F0; font-family:inherit;
    font-size:13.5px; font-weight:600; cursor:pointer;
  }

  /* ============================================================
     画板
     ============================================================ */
  .board{
    position:absolute; inset:0; z-index:100;
    background:#FBFAF6; padding-top:50px;
    display:flex; flex-direction:column;
    transform:translateY(100%);
    transition:transform .36s cubic-bezier(.32,.72,0,1);
  }
  .board.on{ transform:translateY(0); }
  .board-head{
    flex:none; height:52px; padding:0 16px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid #E7E3D9;
  }
  .board-canvas-wrap{ flex:1; position:relative; overflow:hidden; }
  #canvas{ position:absolute; inset:0; width:100%; height:100%; touch-action:none; cursor:crosshair; }
  .board-tools{
    flex:none; padding:10px 14px 16px;
    display:flex; align-items:center; gap:8px;
    border-top:1px solid #E7E3D9; background:#FBFAF6;
  }
  .swatch{ width:24px; height:24px; border-radius:50%; border:2px solid transparent; cursor:pointer; padding:0; }
  .swatch.on{ border-color:#1B1A17; transform:scale(1.08); }
  .size-dot{
    width:30px; height:26px; border-radius:8px; border:1px solid #E1DDD3;
    background:#fff; cursor:pointer; display:grid; place-items:center; padding:0;
  }
  .size-dot.on{ border-color:#1B1A17; background:#F1EEE7; }
  .size-dot i{ display:block; border-radius:50%; background:#1B1A17; }
  .bd-btn{
    height:32px; padding:0 12px; border-radius:9px; border:1px solid #E1DDD3;
    background:#fff; font-family:inherit; font-size:12px; color:var(--ink2); cursor:pointer;
  }
  .bd-done{ background:#1B1A17; color:#F7F5F0; border-color:#1B1A17; font-weight:600; }

  .lb{
    position:absolute; inset:0; z-index:150;
    background:rgba(14,12,10,.94);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .24s;
  }
  .lb.on{ opacity:1; pointer-events:auto; }
  .lb img{ max-width:100%; max-height:100%; object-fit:contain; }

  .toast{
    position:absolute; left:50%; bottom:110px; transform:translate(-50%, 14px);
    background:rgba(27,26,23,.92); color:#F7F5F0;
    font-size:12.5px; padding:9px 16px; border-radius:999px;
    opacity:0; pointer-events:none; transition:opacity .26s, transform .26s;
    z-index:160; white-space:nowrap; max-width:86%; overflow:hidden; text-overflow:ellipsis;
  }
  .toast.on{ opacity:1; transform:translate(-50%, 0); }

  /* ============================================================
     开关（记忆标记用）
     ============================================================ */
  .sw-inp{ position:absolute; opacity:0; width:0; height:0; pointer-events:none; }
  .sw{
    flex:none; width:42px; height:25px; border-radius:999px; background:#DCD7CC;
    position:relative; transition:background .22s; cursor:pointer;
  }
  .sw::after{
    content:''; position:absolute; top:2.5px; left:2.5px; width:20px; height:20px;
    border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.22);
    transition:transform .22s cubic-bezier(.3,.8,.4,1);
  }
  .sw-inp:checked + .sw{ background:#1B1A17; }
  .sw-inp:checked + .sw::after{ transform:translateX(17px); }

  .ed-mem{
    display:flex; align-items:center; gap:12px; width:100%;
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:10px 13px; margin-bottom:14px; cursor:pointer;
  }
  .ed-mem.on{ border-color:#E4B9AE; background:#FDF6F4; }
  .ed-mem .em-txt{ flex:1; min-width:0; }
  .ed-mem .em-txt b{ display:block; font-size:12.5px; font-weight:600; color:var(--ink); }
  .ed-mem .em-txt i{
    display:block; margin-top:3px; font-size:11px; color:var(--muted);
    font-style:normal; line-height:1.5;
  }

  /* ============================================================
     图片选中框 / 缩放把手 / 上下文工具行
     ============================================================ */
  .ed-head{ position:relative; z-index:80; }
  .ed-tools{ position:relative; z-index:80; }
  .ed-rich img{ cursor:pointer; }
  .img-ov{ position:absolute; z-index:70; display:none; pointer-events:none; }
  .img-ov.on{ display:block; }
  .io-box{
    position:absolute; inset:0; border:1.5px solid var(--accent); border-radius:11px;
    box-shadow:0 0 0 3px rgba(192,73,47,.12);
  }
  .io-h{
    position:absolute; right:-11px; bottom:-11px; width:26px; height:26px;
    border-radius:50%; background:var(--accent); border:2.5px solid var(--paper);
    pointer-events:auto; cursor:nwse-resize; touch-action:none;
    display:grid; place-items:center;
  }
  .io-h::after{
    content:''; width:7px; height:7px;
    border-right:1.8px solid #fff; border-bottom:1.8px solid #fff;
  }
  .io-lock{
    position:absolute; left:-9px; top:-9px; width:22px; height:22px; border-radius:50%;
    background:#1B1A17; color:#F7F5F0; display:none; place-items:center;
  }
  .img-ov.locked .io-lock{ display:grid; }
  .img-ov.locked .io-box{ border-color:#8A857A; box-shadow:none; border-style:dashed; }
  .img-bar{ display:none; }
  .img-bar.on{ display:flex; }
  .ib-lbl{ flex:none; font-family:var(--num); font-size:11.5px; color:var(--muted); padding-left:2px; }
  .tb.wide{ padding:0 10px; font-size:11.5px; }

  /* ============================================================
     记忆复习
     ============================================================ */
  .mem-bar{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    border:1px solid var(--line); background:var(--card); border-radius:18px;
    padding:13px 15px; margin-bottom:14px; cursor:pointer;
    font-family:inherit; color:var(--ink);
    animation:rise .36s cubic-bezier(.3,.85,.4,1) both;
  }
  .mem-bar.hot{ background:linear-gradient(180deg,#FDF4F1,#FBEDE8); border-color:#EFD3CB; }
  .mb-ico{
    flex:none; width:34px; height:34px; border-radius:11px;
    display:grid; place-items:center; background:var(--accent-soft); color:var(--accent);
  }
  .mem-bar.hot .mb-ico{ background:rgba(192,73,47,.14); }
  .mb-txt{ flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
  .mb-txt b{ font-size:13.5px; font-weight:600; letter-spacing:-.1px; }
  .mb-txt span{ font-size:11.5px; color:var(--muted); }
  .mb-arrow{ color:#C6C1B6; font-size:16px; flex:none; }

  .dock-mem{
    position:relative; width:54px; height:54px; border-radius:50%; cursor:pointer;
    background:var(--card); border:1px solid #E0DBD0; color:var(--ink);
    display:grid; place-items:center;
    box-shadow:0 10px 26px -10px rgba(35,28,20,.34);
    transition:transform .16s, background .15s, color .15s, border-color .15s;
  }
  .dock-mem:active{ transform:scale(.9); background:#F1EEE7; }
  .dock-mem.has{ border-color:#E4B9AE; background:#FDF6F4; color:var(--accent); }
  .dm-badge{
    position:absolute; top:-3px; right:-3px; min-width:19px; height:19px; padding:0 5px;
    border-radius:999px; background:var(--accent); color:#fff;
    font-family:var(--num); font-size:11px; line-height:19px; text-align:center;
    box-shadow:0 0 0 2.5px var(--paper);
  }
  .dm-badge[hidden]{ display:none; }

  .rv-stats{ display:flex; gap:9px; margin-bottom:14px; }
  .rs-cell{
    flex:1; background:var(--card); border:1px solid var(--line); border-radius:15px;
    padding:13px 10px; text-align:center;
  }
  .rs-cell b{ display:block; font-family:var(--num); font-size:23px; line-height:1.1; font-weight:400; }
  .rs-cell span{ display:block; margin-top:4px; font-size:10.5px; color:var(--muted); }
  .rs-cell.hot b{ color:var(--accent); }

  .rv-curve{
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    padding:14px 12px 11px; margin-bottom:14px;
  }
  .rv-curve svg{ display:block; width:100%; height:auto; }
  .rv-cap{ margin:9px 2px 0; font-size:11px; color:var(--muted); line-height:1.65; text-align:center; }

  .rv-row{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:13px 15px; margin-bottom:9px;
    animation:rise .32s cubic-bezier(.3,.85,.4,1) both;
  }
  .rv-row.due{ border-color:#EFD3CB; }
  .rr-top{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .rr-title{
    font-size:14px; font-weight:600; letter-spacing:-.15px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .rr-due{ flex:none; font-size:10.5px; color:var(--muted); }
  .rr-due.hot{ color:var(--accent); font-weight:600; }
  .rr-meta{ margin-top:5px; font-size:11.5px; color:var(--muted); line-height:1.5; }
  .rr-foot{ display:flex; align-items:center; gap:10px; margin-top:10px; }
  .rr-dots{ display:flex; gap:4px; flex:1; }
  .rr-dots i{ flex:1; max-width:16px; height:5px; border-radius:3px; background:#E7E3D9; }
  .rr-dots i.on{ background:var(--accent); }
  .rr-go{
    flex:none; height:29px; padding:0 15px; border-radius:999px; border:none;
    background:#1B1A17; color:#F7F5F0; font-family:inherit; font-size:12px;
    font-weight:600; cursor:pointer;
  }
  .rr-go:active{ transform:scale(.95); }
  .rr-go.ghost{ background:#F1EEE7; color:var(--ink2); }

  .rv-rem{
    display:flex; align-items:center; gap:12px; margin:4px 0 16px;
    background:var(--card); border:1px solid var(--line); border-radius:16px; padding:13px 15px;
  }
  .rv-rem .rm-txt{ flex:1; min-width:0; }
  .rv-rem b{ display:block; font-size:13px; font-weight:600; }
  .rv-rem span{ display:block; margin-top:3px; font-size:11px; color:var(--muted); line-height:1.5; }

  .rv{
    position:absolute; inset:0; z-index:120; padding-top:50px;
    background:var(--paper); display:flex; flex-direction:column;
    transform:translateY(100%); transition:transform .38s cubic-bezier(.32,.72,0,1);
  }
  .rv.on{ transform:translateY(0); }
  .rv-body{ flex:1; overflow-y:auto; padding:10px 22px 18px; scrollbar-width:none; }
  .rv-body::-webkit-scrollbar{ display:none; }
  .rv-tag{
    display:inline-block; font-size:10.5px; color:var(--accent);
    background:var(--accent-soft); padding:3px 9px; border-radius:999px; margin-bottom:11px;
  }
  .rv-h{ margin:0 0 14px; font-size:19.5px; font-weight:700; letter-spacing:-.4px; line-height:1.42; }
  .rv-note{ color:var(--ink2); line-height:1.8; word-break:break-word; }
  .rv-note p{ margin:0 0 .65em; }
  .rv-note h1,.rv-note h2,.rv-note h3{ margin:.7em 0 .4em; color:var(--ink); line-height:1.35; }
  .rv-note h1{ font-size:1.5em; } .rv-note h2{ font-size:1.25em; } .rv-note h3{ font-size:1.08em; }
  .rv-note img{ max-width:100%; height:auto; border-radius:10px; display:block; margin:.6em 0; }
  .rv-dots{ display:flex; gap:5px; margin:20px 0 0; }
  .rv-dots i{ flex:1; height:5px; border-radius:3px; background:#E7E3D9; }
  .rv-dots i.on{ background:var(--accent); }
  .rv-dots i.cur{ background:#D9A697; }
  .rv-hint{ margin:10px 0 0; font-size:11.5px; color:var(--muted); line-height:1.6; }
  .rv-foot{
    flex:none; display:flex; gap:10px; padding:12px 22px 26px;
    border-top:1px solid var(--line);
  }
  .rv-btn{
    flex:1; height:47px; border-radius:14px; border:1px solid var(--line);
    background:var(--card); color:var(--ink2);
    font-family:inherit; font-size:14px; font-weight:600; cursor:pointer;
    transition:transform .14s;
  }
  .rv-btn:active{ transform:scale(.98); }
  .rv-known{ background:#1B1A17; border-color:#1B1A17; color:#F7F5F0; }

  /* 笔记卡片底部的记忆标记 */
  .nc-foot{
    display:flex; align-items:center; gap:9px;
    margin-top:12px; padding-top:10px; border-top:1px dashed var(--line);
  }
  .nc-mem{
    flex:none; display:flex; align-items:center; gap:5px;
    height:26px; padding:0 11px; border-radius:999px; cursor:pointer;
    border:1px solid var(--line); background:transparent; color:var(--muted);
    font-family:inherit; font-size:11px;
  }
  .nc-mem.on{ border-color:#EFD3CB; background:var(--accent-soft); color:var(--accent); }
  .nc-prog{ flex:1; min-width:0; text-align:right; font-size:11px; color:var(--muted); }

  /* ---------- 账号入口 ---------- */
  .hd-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .acct-btn{
    position:relative; flex:none;
    width:34px; height:34px; border-radius:50%;
    border:1px solid var(--line); background:var(--card); color:var(--ink2);
    display:grid; place-items:center; cursor:pointer; padding:0;
    transition:transform .16s;
  }
  .acct-btn:active{ transform:scale(.93); }
  .ab-dot{
    position:absolute; right:-1px; bottom:-1px;
    width:10px; height:10px; border-radius:50%;
    background:#C9C4B8; border:2px solid var(--paper);
  }
  .ab-dot.online{ background:#3F8E5C; }
  .ab-dot.busy{ background:#C8912F; }
  .ab-dot.off{ background:var(--accent); }

  /* ---------- 账号页 ---------- */
  .acct-card{
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    padding:17px 17px 5px; margin-bottom:14px;
  }
  .acct-who{ display:flex; align-items:center; gap:12px; padding-bottom:14px; }
  .acct-ava{
    width:42px; height:42px; border-radius:50%; flex:none;
    background:var(--ink); color:var(--paper);
    display:grid; place-items:center;
    font-family:var(--num); font-size:17px; font-weight:600;
  }
  .acct-name{ font-size:14.5px; font-weight:650; letter-spacing:-.2px; }
  .acct-sid{ font-size:11.5px; color:var(--muted); margin-top:3px; letter-spacing:.02em; }
  .row{
    display:flex; align-items:center; justify-content:space-between;
    padding:11px 0; border-top:1px solid var(--line); font-size:13.5px;
  }
  .row b{ font-weight:600; }
  .row .rv{ color:var(--muted); font-size:12.5px; }
  .btn-main{
    width:100%; height:47px; border-radius:14px; border:none;
    background:var(--ink); color:var(--paper);
    font-family:var(--sans); font-size:14.5px; font-weight:650;
    cursor:pointer; transition:transform .16s;
  }
  .btn-main:active{ transform:scale(.98); }
  .btn-main[disabled]{ opacity:.45; }
  .btn-ghost{
    width:100%; height:46px; border-radius:14px; margin-top:9px;
    border:1px solid var(--line); background:transparent; color:var(--ink2);
    font-family:var(--sans); font-size:14px; cursor:pointer;
  }
  .note-tip{ font-size:12px; color:var(--muted); line-height:1.8; margin:14px 2px 18px; }

  /* ---------- 登录页 ---------- */
  .auth{
    position:absolute; inset:0; z-index:130;
    background:var(--paper);
    display:flex; flex-direction:column;
    padding:70px 26px 22px;
    transform:translateY(100%);
    transition:transform .42s cubic-bezier(.32,.72,0,1);
  }
  .auth.on{ transform:translateY(0); }
  .auth h2{ margin:0 0 8px; font-size:25px; font-weight:700; letter-spacing:-.7px; }
  .a-sub{ margin:0 0 24px; font-size:12.5px; color:var(--muted); line-height:1.8; }
  .a-tabs{ display:flex; gap:5px; background:#EFEBE1; border-radius:12px; padding:4px; margin-bottom:20px; }
  .a-tab{
    flex:1; height:34px; border:none; border-radius:9px; background:transparent;
    color:var(--ink2); font-family:var(--sans); font-size:13px; cursor:pointer;
  }
  .a-tab.on{ background:var(--card); color:var(--ink); font-weight:650; box-shadow:0 1px 3px rgba(27,26,23,.07); }
  .a-lab{ font-size:11.5px; color:var(--muted); margin:0 0 7px 2px; letter-spacing:.03em; }
  .a-inp{
    width:100%; height:48px; border-radius:13px;
    border:1px solid var(--line); background:var(--card);
    padding:0 14px; font-family:var(--sans); font-size:15px; color:var(--ink);
    outline:none; transition:border-color .16s;
  }
  .a-inp:focus{ border-color:var(--ink); }
  .a-row{ display:flex; gap:8px; }
  .a-code{ flex:1; min-width:0; }
  .a-send{
    flex:none; width:110px; height:48px; border-radius:13px;
    border:1px solid var(--line); background:var(--card);
    font-family:var(--sans); font-size:12.5px; color:var(--ink2); cursor:pointer;
  }
  .a-send[disabled]{ opacity:.5; }
  .a-err{ min-height:17px; margin:10px 2px 0; font-size:12px; color:var(--accent); line-height:1.5; }
  .a-act{ margin-top:12px; }
  .a-hint{ font-size:11.5px; color:var(--muted); line-height:1.7; margin:12px 2px 0; }
  .a-skip{
    margin-top:auto; padding:16px 0 4px; text-align:center;
    font-size:12.5px; color:var(--muted); cursor:pointer;
    text-decoration:underline; text-underline-offset:4px;
  }

  /* ============================================================
     已安装为 App（独立窗口）时的适配
     必须放在样式表最后：要覆盖前面 .phone / .statusbar / .dock 的基础值
     ============================================================ */
  @media all and (display-mode: standalone){
    .phone{
      width:100vw; height:100vh; height:100dvh;
      border-radius:0; box-shadow:none;
    }
    .island,
    .home-bar,
    .statusbar > span{ display:none; }

    .statusbar{
      height:calc(8px + env(safe-area-inset-top, 0px));
      padding:0;
    }
    .dock{ bottom:calc(18px + env(safe-area-inset-bottom, 0px)); }
    .scroll{ padding-bottom:calc(118px + env(safe-area-inset-bottom, 0px)); }
    .ed, .board{ padding-top:calc(8px + env(safe-area-inset-top, 0px)); }
    .sheet{ padding-bottom:calc(26px + env(safe-area-inset-bottom, 0px)); }
    .ed-tools{ padding-bottom:env(safe-area-inset-bottom, 0px); }
  }

  /* ============================================================
     被套壳 App 打开时（网址带 app=1）：系统状态栏在外面，
     所以去掉模拟状态栏、去掉手机外壳，只留一点点呼吸间距
     ============================================================ */
  body.in-app .phone{
    width:100vw; height:100vh; height:100dvh;
    border-radius:0; box-shadow:none;
  }
  body.in-app .island,
  body.in-app .home-bar,
  body.in-app .statusbar > span{ display:none; }
  body.in-app .statusbar{ height:8px; padding:0; }
  body.in-app .dock{ bottom:18px; }
  body.in-app .scroll{ padding-bottom:118px; }
  body.in-app .ed,
  body.in-app .board{ padding-top:8px; }
  body.in-app .sheet{ padding-bottom:26px; }
  body.in-app .install-tip{ display:none; }

  /* ============================================================
     笔记详情弹层（点卡片进来，可以看全文、编辑、删除）
     ============================================================ */
  .nd{ max-height:84%; }
  .nd-head{ flex:none; display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
  .nd-time{ font-family:var(--num); font-size:11.5px; color:var(--muted); }
  .nd-x{
    border:none; background:transparent; color:var(--muted); cursor:pointer;
    font-family:inherit; font-size:12.5px; padding:6px 2px;
  }
  .nd-scroll{ flex:1; min-height:0; overflow-y:auto; scrollbar-width:none; padding:2px 0 10px; }
  .nd-scroll::-webkit-scrollbar{ display:none; }
  .nd-title{ margin:0 0 9px; font-size:19px; font-weight:700; letter-spacing:-.4px; line-height:1.45; }
  .nd-tags{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .nd-tag{ font-size:10.5px; color:var(--accent); background:var(--accent-soft); padding:3px 9px; border-radius:999px; }
  .nd-tag.plain{ color:var(--muted); background:rgba(0,0,0,.045); }
  .nd-body{ font-size:15px; }
  .nd-foot{ flex:none; display:flex; gap:10px; padding-top:13px; border-top:1px solid var(--line); }
  .nd-btn{
    flex:1; height:46px; border-radius:13px; cursor:pointer;
    border:1px solid var(--line); background:var(--card); color:var(--ink2);
    font-family:inherit; font-size:14px; font-weight:600;
    transition:transform .14s;
  }
  .nd-btn:active{ transform:scale(.98); }
  .nd-btn.danger{ color:var(--accent); border-color:rgba(192,73,47,.3); background:var(--accent-soft); }

  /* ---------- 通用确认框 ---------- */
  .dlg{
    position:absolute; inset:0; z-index:170; padding:0 32px;
    display:flex; align-items:center; justify-content:center;
    background:rgba(22,18,14,.34);
    opacity:0; pointer-events:none; transition:opacity .22s;
  }
  .dlg.on{ opacity:1; pointer-events:auto; }
  .dlg-box{
    width:100%; max-width:302px; padding:22px 20px 16px;
    background:var(--card); border-radius:20px;
    box-shadow:0 26px 60px -22px rgba(20,15,10,.55);
    transform:scale(.94); transition:transform .22s cubic-bezier(.3,.9,.4,1);
  }
  .dlg.on .dlg-box{ transform:scale(1); }
  .dlg-box h4{ margin:0 0 8px; font-size:16.5px; font-weight:700; letter-spacing:-.2px; }
  .dlg-box p{ margin:0 0 18px; font-size:12.5px; line-height:1.7; color:var(--muted); }
  .dlg-act{ display:flex; gap:9px; }
  .dlg-act button{
    flex:1; height:44px; border-radius:12px; cursor:pointer; font-family:inherit;
    font-size:14px; font-weight:600;
    border:1px solid var(--line); background:transparent; color:var(--ink2);
  }
  .dlg-act .danger{ background:#C0492F; border-color:#C0492F; color:#fff; }
  .dlg-act button:active{ transform:scale(.97); }

  /* ---------- 首页右上角按钮组 ---------- */
  .hd-acts{ display:flex; align-items:center; gap:8px; }
  .theme-btn .ic-sun{ display:none; }
  html[data-theme="dark"] .theme-btn .ic-moon{ display:none; }
  html[data-theme="dark"] .theme-btn .ic-sun{ display:block; }

  /* ============================================================
     夜间模式
     暖纸配色反过来：底是墨，字是纸。只覆盖颜色，不动排版
     ============================================================ */
  html[data-theme="dark"]{
    --paper:#17150F;
    --card:#221F18;
    --ink:#F2EFE7;
    --ink2:#BCB7AB;
    --muted:#847E72;
    --line:#332E25;
    --accent:#E4826A;
    --accent-soft:rgba(228,130,106,.14);
    color-scheme:dark;
  }
  html[data-theme="dark"] body{ background:var(--paper); }
  @media (min-width:461px){
    html[data-theme="dark"] body{
      background:radial-gradient(circle at 50% -10%, #221F18 0%, #0C0B08 100%);
    }
  }
  html[data-theme="dark"] .phone{
    box-shadow:0 0 0 11px #0A0A0C, 0 0 0 13px #2B2B30, 0 44px 90px -24px rgba(0,0,0,.9);
  }
  html[data-theme="dark"] .island{ background:#000; }
  html[data-theme="dark"] .home-bar{ background:rgba(255,255,255,.22); }

  /* 原来是「深底浅字」的强调块，深色下统一翻成「浅底深字」 */
  html[data-theme="dark"] .year-card.current,
  html[data-theme="dark"] .tb.on,
  html[data-theme="dark"] .folder-bar .txt-btn.on,
  html[data-theme="dark"] .inp-sheet button,
  html[data-theme="dark"] .dock-cont,
  html[data-theme="dark"] .rr-go,
  html[data-theme="dark"] .rv-known,
  html[data-theme="dark"] .day-cell.today .d-num{
    background:var(--ink); border-color:var(--ink); color:var(--paper);
  }
  html[data-theme="dark"] .sw-inp:checked + .sw{ background:var(--ink); }
  html[data-theme="dark"] .sw-inp:checked + .sw::after{ background:var(--paper); }
  html[data-theme="dark"] .day-cell.today .d-dot{ background:var(--ink); }
  html[data-theme="dark"] .swatch.on,
  html[data-theme="dark"] .cw.on{ border-color:var(--ink); }
  html[data-theme="dark"] .month-cell.cur{ border-color:var(--ink); }
  html[data-theme="dark"] .io-lock{ background:var(--ink); color:var(--paper); }

  /* 浅色小色块 / 分隔 */
  html[data-theme="dark"] .seg,
  html[data-theme="dark"] .a-tabs{ background:#2A261E; }
  html[data-theme="dark"] .seg-btn.on,
  html[data-theme="dark"] .a-tab.on{ box-shadow:0 1px 3px rgba(0,0,0,.45); }
  html[data-theme="dark"] .back:active,
  html[data-theme="dark"] .dock-add:active,
  html[data-theme="dark"] .dock-mem:active,
  html[data-theme="dark"] .tb:active,
  html[data-theme="dark"] .fo-row:active{ background:#2E2A21; }
  html[data-theme="dark"] .rr-go.ghost{ background:#2E2A21; color:var(--ink2); }

  /* 边框、占位符、次要小字 */
  html[data-theme="dark"] .dock-add,
  html[data-theme="dark"] .dock-mem{
    border-color:var(--line);
    box-shadow:0 10px 26px -10px rgba(0,0,0,.7);
  }
  html[data-theme="dark"] .folder-new{ border-color:#3B362C; }
  html[data-theme="dark"] .folder-new:active{ background:rgba(255,255,255,.03); }
  html[data-theme="dark"] .empty-state .es-mark{ border-color:#3B362C; color:#5A5448; }
  html[data-theme="dark"] .month-cell.empty .m-num,
  html[data-theme="dark"] .ed-save:disabled{ color:#5A5448; }
  html[data-theme="dark"] .ed-inp::placeholder,
  html[data-theme="dark"] .ed-rich:empty::before{ color:#5A5448; }
  html[data-theme="dark"] .fo-row .fo-ind,
  html[data-theme="dark"] .mb-arrow{ color:#5A5448; }
  html[data-theme="dark"] .sheet-handle{ background:#3B362C; }
  html[data-theme="dark"] .inp-sheet input:focus{ border-color:#5A5448; }
  html[data-theme="dark"] .folder-card .fc-del,
  html[data-theme="dark"] .folder-card .fc-edit{ background:#332E25; }
  html[data-theme="dark"] .rr-dots i,
  html[data-theme="dark"] .rv-dots i{ background:#332E25; }
  html[data-theme="dark"] .rv-dots i.cur{ background:#8A4C3D; }
  html[data-theme="dark"] .sw{ background:#3B362C; }
  html[data-theme="dark"] .sw::after{ background:#8C8678; }
  html[data-theme="dark"] .day-cell.has{ background:rgba(228,130,106,.10); }
  html[data-theme="dark"] .nd-tag.plain{ background:rgba(255,255,255,.06); }
  html[data-theme="dark"] .ab-dot{ background:#4E483C; }

  /* 需要「暖色底」的提示块 */
  html[data-theme="dark"] .ed-mem.on,
  html[data-theme="dark"] .dock-mem.has{ background:rgba(228,130,106,.10); border-color:rgba(228,130,106,.4); }
  html[data-theme="dark"] .mem-bar.hot{
    background:linear-gradient(180deg, rgba(228,130,106,.14), rgba(228,130,106,.06));
    border-color:rgba(228,130,106,.32);
  }
  html[data-theme="dark"] .rv-row.due,
  html[data-theme="dark"] .nc-mem.on{ border-color:rgba(228,130,106,.32); }
  html[data-theme="dark"] .sheet-mask{ background:rgba(0,0,0,.55); }
  html[data-theme="dark"] .dlg{ background:rgba(0,0,0,.55); }
  html[data-theme="dark"] .toast{ background:rgba(242,239,231,.94); color:#17150F; }

  /* 手写板始终是一张「白纸」，画出来的图放进笔记才不会反差过大 */
  html[data-theme="dark"] .board,
  html[data-theme="dark"] .board-head,
  html[data-theme="dark"] .board-tools{ background:#FBFAF6; }
  html[data-theme="dark"] .board-head{ border-bottom-color:#E7E3D9; }
  html[data-theme="dark"] .board-tools{ border-top-color:#E7E3D9; }
  html[data-theme="dark"] .board .ed-cancel{ color:#7A756A; }
  html[data-theme="dark"] .board .ed-t{ color:#1B1A17; }
  html[data-theme="dark"] .size-dot{ background:#fff; border-color:#E1DDD3; }
  html[data-theme="dark"] .size-dot.on{ background:#F1EEE7; border-color:#1B1A17; }
  html[data-theme="dark"] .size-dot i{ background:#1B1A17; }
  html[data-theme="dark"] .bd-btn{ background:#fff; border-color:#E1DDD3; color:#57544D; }
  html[data-theme="dark"] .bd-done{ background:#1B1A17; border-color:#1B1A17; color:#F7F5F0; }
  html[data-theme="dark"] .swatch.on{ border-color:#1B1A17; }
</style>
</head>
<body>
<div class="phone">
  <div class="island"></div>
  <div class="statusbar">
    <span>9:41</span>
    <span class="sb-icons">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.6" y="5" width="3" height="6" rx="1"/><rect x="9.2" y="2.6" width="3" height="8.4" rx="1"/><rect x="13.8" y="0" width="3" height="11" rx="1"/></svg>
      <svg width="16" height="11" viewBox="0 0 16 11" fill="currentColor"><path d="M8 10.3 5.5 7.8a3.5 3.5 0 0 1 5 0L8 10.3Zm-4.1-4.1a6 6 0 0 1 8.2 0l1.2-1.2a7.7 7.7 0 0 0-10.6 0l1.2 1.2ZM1.8 4a8.7 8.7 0 0 1 12.4 0l1.1-1.1a10.3 10.3 0 0 0-14.6 0L1.8 4Z"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="3.2" stroke="currentColor" stroke-opacity=".35"/><rect x="2" y="2" width="15" height="8" rx="1.9" fill="currentColor"/><path d="M23 4.2v3.6a2 2 0 0 0 0-3.6Z" fill="currentColor" fill-opacity=".35"/></svg>
    </span>
  </div>

  <div class="stage">

    <section class="screen active" id="s-home">
      <header class="hd">
        <div class="hd-top">
          <h1 class="h1">学习笔记</h1>
          <div class="hd-acts">
            <button class="acct-btn theme-btn" id="btn-theme" aria-label="切换夜间模式">
              <svg class="ic-moon" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16.5 11.4A6.6 6.6 0 0 1 8.6 3.5a6.6 6.6 0 1 0 7.9 7.9Z"/>
              </svg>
              <svg class="ic-sun" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="10" cy="10" r="3.6"/>
                <path d="M10 1.8v2M10 16.2v2M1.8 10h2M16.2 10h2M4.2 4.2l1.4 1.4M14.4 14.4l1.4 1.4M15.8 4.2l-1.4 1.4M5.6 14.4l-1.4 1.4"/>
              </svg>
            </button>
            <button class="acct-btn" id="btn-account" aria-label="账号与同步">
              <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="10" cy="6.6" r="3.3"/>
                <path d="M3.7 17.2c0-3.2 2.8-5.1 6.3-5.1s6.3 1.9 6.3 5.1"/>
              </svg>
              <span class="ab-dot" id="ab-dot"></span>
            </button>
          </div>
        </div>
        <p class="sub" id="home-sub">—</p>
        <div class="seg" id="seg">
          <button class="seg-btn on" data-view="time">按时间</button>
          <button class="seg-btn" data-view="folder">按文件夹</button>
        </div>
      </header>
      <div class="scroll" id="home-scroll">
        <button class="mem-bar" id="mem-bar">
          <span class="mb-ico">
            <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 13.4c0-4.6 3.2-8.4 7-8.4s7 3.8 7 8.4"/>
              <path d="M6.6 13.2V9.8M10 13.2V7.2M13.4 13.2V9.8"/>
              <path d="M2.6 16.4h14.8"/>
            </svg>
          </span>
          <span class="mb-txt"><b id="mb-t">—</b><span id="mb-s">—</span></span>
          <span class="mb-arrow">›</span>
        </button>
        <div class="year-list" id="year-list"></div>
        <div id="folder-pane" style="display:none">
          <div class="folder-bar">
            <div class="crumb" id="crumb"></div>
            <button class="txt-btn" id="btn-manage">管理</button>
          </div>
          <div class="folder-grid" id="folder-grid"></div>
          <div id="folder-notes"></div>
        </div>
      </div>
    </section>

    <section class="screen" id="s-months">
      <header class="hd hd-nav">
        <button class="back" data-back="s-home" aria-label="返回">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2.5 4.5 8l5.5 5.5"/></svg>
        </button>
        <div class="nav-title">
          <h2 class="h2" id="months-title">—</h2>
          <p class="sub" id="months-sub">—</p>
        </div>
      </header>
      <div class="scroll"><div class="month-grid" id="month-grid"></div></div>
    </section>

    <section class="screen" id="s-days">
      <header class="hd hd-nav">
        <button class="back" data-back="s-months" aria-label="返回">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2.5 4.5 8l5.5 5.5"/></svg>
        </button>
        <div class="nav-title">
          <h2 class="h2" id="days-title">—</h2>
          <p class="sub" id="days-sub">—</p>
        </div>
        <div class="nav-extra">
          <button class="arrow" id="btn-prev" aria-label="上个月">‹</button>
          <button class="arrow" id="btn-next" aria-label="下个月">›</button>
        </div>
      </header>
      <div class="scroll">
        <div class="week-head"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
        <div class="cal-grid" id="cal-grid"></div>
        <p class="cal-foot" id="cal-foot"></p>
      </div>
    </section>

    <section class="screen" id="s-day">
      <header class="hd hd-nav">
        <button class="back" id="back-from-day" aria-label="返回">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2.5 4.5 8l5.5 5.5"/></svg>
        </button>
        <div class="nav-title">
          <h2 class="h2" id="day-title">—</h2>
          <p class="sub" id="day-sub">—</p>
        </div>
      </header>
      <div class="scroll" id="day-body"></div>
    </section>

    <section class="screen" id="s-review">
      <header class="hd hd-nav">
        <button class="back" data-back="s-home" aria-label="返回">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2.5 4.5 8l5.5 5.5"/></svg>
        </button>
        <div class="nav-title">
          <h2 class="h2">记忆复习</h2>
          <p class="sub" id="rv-sub">—</p>
        </div>
      </header>
      <div class="scroll" id="rv-scroll">
        <div class="rv-stats" id="rv-stats"></div>
        <div class="rv-curve" id="rv-curve"></div>
        <label class="rv-rem">
          <span class="rm-txt">
            <b>到期提醒</b>
            <span id="rem-sub">打开后，有到期笔记会在页面顶部提示</span>
          </span>
          <input type="checkbox" id="rem-inp" class="sw-inp">
          <span class="sw"></span>
        </label>
        <div id="rv-list"></div>
      </div>
    </section>

    <section class="screen" id="s-account">
      <header class="hd hd-nav">
        <button class="back" data-back="s-home" aria-label="返回">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2.5 4.5 8l5.5 5.5"/></svg>
        </button>
        <div class="nav-title">
          <h2 class="h2">账号与同步</h2>
          <p class="sub" id="acct-sub">—</p>
        </div>
      </header>
      <div class="scroll" id="acct-body"></div>
    </section>

  </div>

  <div class="dock">
    <button class="dock-add" id="btn-add" aria-label="新建笔记">+</button>
    <button class="dock-mem" id="btn-mem" aria-label="记忆复习" title="记忆复习">
      <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linejoin="round" stroke-linecap="round">
        <rect x="2.4" y="6.6" width="11.4" height="10.6" rx="2.6"/>
        <path d="M5.8 4.3h8.2a2.6 2.6 0 0 1 2.6 2.6v8.4" opacity=".42"/>
        <path d="M5.6 11.9l1.7 1.7 3.3-3.4"/>
      </svg>
      <span class="dm-badge" id="dm-badge" hidden>0</span>
    </button>
    <button class="dock-cont" id="btn-continue" aria-label="继续学习" title="继续学习">
      <svg width="17" height="17" viewBox="0 0 16 16" fill="currentColor"><path d="M4.6 2.5 13.3 8 4.6 13.5z"/></svg>
    </button>
  </div>

  <!-- 编辑器 -->
  <div class="ed" id="ed">
    <div class="ed-head">
      <button class="ed-cancel" id="ed-cancel">取消</button>
      <span class="ed-t" id="ed-mode">新建笔记</span>
      <button class="ed-save" id="ed-save" disabled>保存</button>
    </div>
    <div class="ed-body" id="ed-body">
      <div class="ed-folder" id="ed-folder">
        <span class="ef-ico">▤</span>
        <span class="ef-path" id="ed-folder-path">未分类</span>
        <span class="ef-act">更改 ›</span>
      </div>
      <label class="ed-mem" id="ed-mem-row">
        <span class="em-txt">
          <b>加入记忆复习</b>
          <i id="ed-mem-sub">按艾宾浩斯曲线安排 7 次回看</i>
        </span>
        <input type="checkbox" id="ed-mem" class="sw-inp">
        <span class="sw"></span>
      </label>
      <input class="ed-inp" id="ed-title-inp" placeholder="今天学了什么" maxlength="50" autocomplete="off">
      <div class="ed-rich" id="ed-rich" contenteditable="true" data-ph="展开写两句，遗忘会慢很多…"></div>
    </div>
    <div class="ed-tools">
      <div class="tb-row">
        <button class="tb" data-block="p">正文</button>
        <button class="tb" data-block="h1">H1</button>
        <button class="tb" data-block="h2">H2</button>
        <button class="tb" data-block="h3">H3</button>
        <span class="tb-sep"></span>
        <button class="tb" id="tb-fs-minus">A−</button>
        <button class="tb" id="tb-fs-plus">A+</button>
      </div>
      <div class="tb-row">
        <button class="tb" data-cmd="bold"><b>B</b></button>
        <button class="tb" data-cmd="italic"><i>I</i></button>
        <button class="tb" data-cmd="underline"><u>U</u></button>
        <span class="tb-sep"></span>
        <button class="cw" data-color="#1B1A17" style="background:#1B1A17" aria-label="墨黑"></button>
        <button class="cw" data-color="#C0492F" style="background:#C0492F" aria-label="朱红"></button>
        <button class="cw" data-color="#2F5D8A" style="background:#2F5D8A" aria-label="靛蓝"></button>
        <button class="cw" data-color="#3F7A52" style="background:#3F7A52" aria-label="松绿"></button>
        <span class="tb-sep"></span>
        <button class="tb" id="tb-img" aria-label="插入图片">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1.8 5.2h2.6L5.6 3h4.8l1.2 2.2h2.6v7.6H1.8z" stroke-linejoin="round"/><circle cx="8" cy="8.7" r="2.4"/></svg>
        </button>
        <button class="tb" id="tb-draw" aria-label="画图">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11.2 1.9 14.1 4.8 5.6 13.3 2 14l.7-3.6z"/></svg>
        </button>
        <button class="tb" data-cmd="insertOrderedList" aria-label="有序列表">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 4h1.4v4M2 12h2.2M2.4 8.2h1.2a1 1 0 1 1 0 2H2.4M7.4 4.4H14M7.4 8H14M7.4 11.6H14"/></svg>
        </button>
      </div>
      <div class="tb-row img-bar" id="img-bar">
        <span class="ib-lbl" id="ib-size">—</span>
        <span class="tb-sep"></span>
        <button class="tb wide" id="ib-lock">锁定</button>
        <button class="tb wide" id="ib-full">满宽</button>
        <button class="tb wide" id="ib-half">一半</button>
        <button class="tb wide" id="ib-del">删除</button>

  { id:'f-408',  name:'408',       parent:null },
  { id:'f-ds',   name:'数据结构',   parent:'f-408' },
  { id:'f-os',   name:'操作系统',   parent:'f-408' },

];

let FOLDERS;
try {
  const raw = localStorage.getItem(LS_FOLDERS);
  FOLDERS = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(DEFAULT_FOLDERS));
  if (!Array.isArray(FOLDERS) || !FOLDERS.length) throw 0;
} catch(e){ FOLDERS = JSON.parse(JSON.stringify(DEFAULT_FOLDERS)); }

let FOLDER_DEL = [];
try { FOLDER_DEL = JSON.parse(localStorage.getItem(LS_FDEL) || '[]'); } catch(e){ FOLDER_DEL = []; }

/* ============================================================
   2. 笔记数据
   这里只放你自己写的笔记，不再生成任何示例内容
   ============================================================ */
/* dateKey 形如 2026-10-26，全站都用它当索引 */
function keyOf(y, m, d){

}

const DATA = {};            /* dateKey → [笔记, 笔记, …] */

const WEEK = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

let USER_NOTES = [];
try { USER_NOTES = JSON.parse(localStorage.getItem(LS_NOTES) || '[]'); } catch(e){ USER_NOTES = []; }

/* 从上一版（纯文本 + 固定科目）迁移过来 */
if (!USER_NOTES.length){
  let old = [];
  try { old = JSON.parse(localStorage.getItem('wb_study_notes_v2') || '[]'); } catch(e){ old = []; }
  const MAP = { ds:'f-ds', os:'f-os', cn:'f-cn', co:'f-co', math:'f-math', eng:'f-eng', pol:'f-pol', misc:'f-misc' };
  old.forEach(it => {
    if (!it || !it.note) return;
    const n = it.note;
    let html = '<p>' + esc(n.body || '') + '</p>';
    if (n.imgs && n.imgs.length) html += n.imgs.map(src => '<img src="' + src + '" alt="">').join('');
    USER_NOTES.push({ date: it.date, note: {
      id: 'm' + Math.random().toString(36).slice(2, 8),
      time: n.time || '12:00',
      folder: MAP[n.cat] || null,
      title: n.title || '未命名',
      html,
      text: String(n.body || '').slice(0, 200),
      fs: n.fs || 14
    }});
  });
  if (USER_NOTES.length) persistNotes();
}

function attachUserNotes(){
  USER_NOTES.forEach(it => {
    if (!it || !it.date || !it.note) return;
    if (!DATA[it.date]) DATA[it.date] = [];
    if (!DATA[it.date].some(n => n.id === it.note.id)) DATA[it.date].push(it.note);
  });
  for (const k in DATA) DATA[k].sort((a, b) => (a.time || '').localeCompare(b.time || ''));
}

/* 把 DATA 按 USER_NOTES 重建（云同步合并、删除笔记之后都要重跑一遍） */
function rebuildData(){
  for (const k in DATA) delete DATA[k];
  attachUserNotes();
}

attachUserNotes();

function persistNotes(){
  try { localStorage.setItem(LS_NOTES, JSON.stringify(USER_NOTES)); syncSoon(); return true; }
  catch(e){ return false; }
}

/* 删掉的笔记要留一块「墓碑」，否则下次同步会从别的设备把它又拉回来 */
const LS_NDEL = 'wb_notes_ndel_v1';
let NOTE_DEL = [];
try { NOTE_DEL = JSON.parse(localStorage.getItem(LS_NDEL) || '[]'); } catch(e){ NOTE_DEL = []; }
if (!Array.isArray(NOTE_DEL)) NOTE_DEL = [];

}

/* 每条笔记 / 文件夹 / 复习记录都带 uap（最后修改时间戳），同步时用它判断谁新 */
function ensureUap(){
  const now = Date.now();
  let dirty = false;
  USER_NOTES.forEach((it, i) => {
    if (it && it.note && !it.note.uap){ it.note.uap = now - USER_NOTES.length + i; dirty = true; }
  });
  FOLDERS.forEach((f, i) => { if (!f.uap){ f.uap = now - FOLDERS.length + i; dirty = true; } });
  if (typeof REVIEWS !== 'undefined'){
    let rd = false;
    REVIEWS.forEach((r, i) => { if (r && !r.uap){ r.uap = now - REVIEWS.length + i; rd = true; } });
    if (rd) saveReviews();
  }
  if (dirty) persistNotes();
}

/* ============================================================
   3. 文件夹工具
   ============================================================ */
function folderById(id){ return FOLDERS.find(f => f.id === id) || null; }
function childrenOf(id){ return FOLDERS.filter(f => f.parent === id); }
function pathOf(id){
  const arr = [];
  let cur = folderById(id);
  while (cur){ arr.unshift(cur); cur = cur.parent ? folderById(cur.parent) : null; }
  return arr;
}
function pathText(id){
  const p = pathOf(id);
  return p.length ? p.map(f => f.name).join(' / ') : '未分类';
}
function descendants(id){
  const out = [id];
  for (let i = 0; i < out.length; i++){
    FOLDERS.filter(f => f.parent === out[i]).forEach(f => out.push(f.id));
  }
  return out;
}
function countInFolder(id){
  const set = new Set(descendants(id));
  let n = 0;
  for (const k in DATA) DATA[k].forEach(x => { if (set.has(x.folder)) n++; });
  return n;
}
function notesInFolder(id){
  const out = [];
  for (const k in DATA){
    DATA[k].forEach(x => { if (x.folder === id) out.push(Object.assign({ date:k }, x)); });
  }
  out.sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
  return out;
}
function flatTree(parent, depth, out){
  childrenOf(parent).forEach(f => {
    out.push({ id:f.id, name:f.name, depth });
    flatTree(f.id, depth + 1, out);
  });
  return out;
}
function uid(){ return 'f' + Date.now().toString(36) + Math.floor(Math.random() * 999).toString(36); }

/* ============================================================
   4. 统计与工具
   ============================================================ */
function totalNotes(){
  let n = 0;
  for (const k in DATA) n += DATA[k].length;
  return n;
}
function countYear(y){
  let n = 0;
  for (const k in DATA) if (k.startsWith(y + '-')) n += DATA[k].length;
  return n;
}
function countMonth(y, m){
  let n = 0;
  const pre = y + '-' + String(m + 1).padStart(2, '0');
  for (const k in DATA) if (k.startsWith(pre)) n += DATA[k].length;
  return n;
}
function monthActivity(y, m){
  let days = 0;
  const pre = y + '-' + String(m + 1).padStart(2, '0');
  for (const k in DATA) if (k.startsWith(pre)) days++;
  return days;
}
function latestKey(){
  let best = null;
  for (const k in DATA) if (!best || k > best) best = k;
  return best;
}
function fmtDate(k){
  const p = k.split('-');
  return Number(p[1]) + ' 月 ' + Number(p[2]) + ' 日';
}
function esc(s){
  return String(s || '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
}
function sanitize(html){
  const d = document.createElement('div');
  d.innerHTML = html || '';
  d.querySelectorAll('script,style,iframe,object,embed,link,meta').forEach(n => n.remove());
  d.querySelectorAll('*').forEach(el => {
    Array.from(el.attributes).forEach(a => {
      if (/^on/i.test(a.name)) el.removeAttribute(a.name);
      if ((a.name === 'href' || a.name === 'src') && /^\s*javascript:/i.test(a.value)) el.removeAttribute(a.name);
    });
  });
  return d.innerHTML;
}

/* ============================================================
   4.5 图片的云端化
   笔记里不直接存图片二进制，改成 wbimg://<存储路径>，
   渲染时换成有时效的下载链接。这样一条带图笔记在库里只有几百字节。
   ============================================================ */
const IMG_URL = new Map();          /* 存储路径 → 可访问链接 */
const IMG_EXP = new Map();          /* 链接的过期时间 */
const IMG_PENDING = new Set();      /* 还没拿到链接的路径 */
const IMG_MARK = 'wbimg://';

function uuid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}

/* 把 wbimg:// 换成真实链接 */
function hydrate(html){
  if (!html || html.indexOf(IMG_MARK) < 0) return html;
  return html.replace(/(<img[^>]*?\ssrc=")wbimg:\/\/([^"]+)(")/g, (m, a, path, c) => {
    const url = IMG_URL.get(path);
    if (url) return a + url + c;
    IMG_PENDING.add(path);
    return a + 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7' + c;
  });
}

/* 渲染富文本正文的唯一入口 */
function renderRich(html){
  return sanitize(hydrate(html || ''));
}

/* 反向操作：编辑保存时把临时链接换回 wbimg:// 路径，
   否则链接一过期，图片就变成裂图 */
function unhydrate(html){
  if (!html || !IMG_URL.size) return html;
  let out = html;
  IMG_URL.forEach(function(url, path){
    if (!url) return;
    out = out.split('src="' + url + '"').join('src="' + IMG_MARK + path + '"');
  });
  return out;
}

/* 把正文里的 data: 图片传上去，换成路径标记（失败就保留原样，宁可不省流量也不能丢图） */
async function dehydrate(html){
  if (!html || html.indexOf('data:image') < 0) return html;
  if (!SYNC.user || !cloud) return html;
  const box = document.createElement('div');
  box.innerHTML = html;
  const imgs = Array.from(box.querySelectorAll('img'));
  for (const im of imgs){
    const src = im.getAttribute('src') || '';
    if (!src.startsWith('data:')) continue;
    try {
      const blob = await (await fetch(src)).blob();
      if (blob.size > 3 * 1024 * 1024) continue;
      const ext = /png/i.test(blob.type) ? 'png' : 'jpg';
      const path = cloud.storage.userPath(SYNC.user.id, 'notes/' + uuid() + '.' + ext);
      const up = await cloud.storage.upload(path, blob, { contentType: blob.type || 'image/jpeg' });
      if (up.error || !up.data) continue;
      const rel = path.replace(/^users\/[^/]+\//, '');
      im.setAttribute('src', IMG_MARK + rel);
      const signed = await cloud.storage.createSignedUrl(path, 3600);
      if (!signed.error && signed.data){
        IMG_URL.set(rel, signed.data.signedUrl || signed.data.url || signed.data.signed_url);
      }
    } catch(e){ /* 保留 base64，不影响笔记 */ }
  }
  return box.innerHTML;
}

/* 批量换取下载链接 */
async function preloadImages(){
  if (!SYNC.user || !cloud) return;
  const paths = new Set();
  USER_NOTES.forEach(it => {
    const h = it && it.note && it.note.html;
    if (!h || h.indexOf(IMG_MARK) < 0) return;
    const re = /wbimg:\/\/([^"]+)/g;
    let m;
    while ((m = re.exec(h))) paths.add(m[1]);
  });
  const now = Date.now();
  const need = [];
  paths.forEach(p => {
    const hit = IMG_URL.get(p);
    if (!hit || (IMG_EXP.get(p) || 0) < now + 120000) need.push(p);
  });
  if (!need.length) return;
  for (let i = 0; i < need.length; i += 40){
    const chunk = need.slice(i, i + 40);
    const full = chunk.map(p => cloud.storage.userPath(SYNC.user.id, p));
    try {
      const r = await cloud.storage.createSignedUrls(full, 3600);
      if (r.error || !r.data) continue;
      const arr = Array.isArray(r.data) ? r.data : (r.data.signedUrls || []);
      arr.forEach((it, idx) => {
        const rel = chunk[idx];
        const url = it && (it.signedUrl || it.url || it.signed_url);
        if (rel && url){ IMG_URL.set(rel, url); IMG_EXP.set(rel, now + 3000000); }
      });
    } catch(e){}
  }
}

      '从 ' + fp[0] + ' 年 ' + Number(fp[1]) + ' 月开始 · 共 ' + totalNotes() + ' 篇';
  }

  /* 今年 + 前两年，加上任何有笔记的年份，一起排出来 */
  const set = new Set([cy, cy - 1, cy - 2]);
  keys.forEach(k => set.add(Number(k.slice(0, 4))));
  const years = Array.from(set).filter(y => y > 1990 && y < 3000).sort((a, b) => b - a);

  document.getElementById('year-list').innerHTML = years.map(y => {
    const total = countYear(y);
    const bars = Array.from({ length:12 }, (_, m) => {
      const c = monthActivity(y, m);
      return '<i style="height:' + (c === 0 ? 2 : Math.min(18, 4 + c * 1.5)).toFixed(1) + 'px"></i>';
    }).join('');
    return '<button class="year-card' + (y === cy ? ' current' : '') + '" data-year="' + y + '">' +
      '<div class="yc-top"><span class="yc-num">' + y + '</span>' +
      '<span class="yc-meta">' + total + ' 篇' +
      '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg>' +
      '</span></div><div class="yc-bars">' + bars + '</div></button>';
  }).join('');

  document.querySelectorAll('.year-card').forEach(c => {
    c.addEventListener('click', () => {
      state.y = Number(c.dataset.year);
      renderMonths();
      go('s-months');
    });
  });
}

function renderFolderPane(){

  const list = cur ? notesInFolder(cur) : [];
  const box = document.getElementById('folder-notes');

      list.map((n, i) =>

    box.querySelectorAll('.list-item').forEach(el => {
      el.addEventListener('click', () => openNoteDetail(el.dataset.date, el.dataset.nid));

  } else {

  /* 当前层的新建入口 */

const inpMask  = document.getElementById('inp-mask');
const inpSheet = document.getElementById('inp-sheet');
const inpName  = document.getElementById('inp-name');
let inpMode = 'create', inpTarget = null;

function askInput(mode, id){
  inpMode = mode; inpTarget = id;
  document.getElementById('inp-title').textContent = mode === 'create'
    ? (state.folder ? '在「' + folderById(state.folder).name + '」里新建' : '新建文件夹')
    : '重命名';
  inpName.value = mode === 'rename' ? folderById(id).name : '';
  document.getElementById('inp-ok').textContent = mode === 'create' ? '创建' : '保存';
  inpMask.classList.add('on');
  inpSheet.classList.add('on');
  setTimeout(() => inpName.focus(), 340);
}
function closeInput(){
  inpMask.classList.remove('on');
  inpSheet.classList.remove('on');
  inpName.blur();
}
inpMask.addEventListener('click', closeInput);
document.getElementById('inp-ok').addEventListener('click', submitInput);
inpName.addEventListener('keydown', e => { if (e.key === 'Enter') submitInput(); });

function submitInput(){
  const name = inpName.value.trim();
  if (!name) return;
  const now = Date.now();
  if (inpMode === 'create'){
    FOLDERS.push({ id: uid(), name, parent: state.folder, uap: now });
    saveFolders();
    toast('已创建「' + name + '」');
  } else {
    const f = folderById(inpTarget);
    if (f){ f.name = name; f.uap = now; saveFolders(); toast('已重命名'); }
  }
  closeInput();
  renderFolderPane();
}

let pendingDel = null, delTimer = null;
function askRemove(id){
  const f = folderById(id);
  if (!f) return;
  if (pendingDel !== id){
    pendingDel = id;
    clearTimeout(delTimer);
    delTimer = setTimeout(() => { pendingDel = null; }, 3200);
    toast('再点一次 × 确认删除「' + f.name + '」');
    return;
  }
  pendingDel = null;
  const kids = descendants(id);
  const parent = f.parent;
  const set = new Set(kids);
  const now = Date.now();

  for (const k in DATA) DATA[k].forEach(n => { if (set.has(n.folder)) n.folder = parent; });
  USER_NOTES.forEach(it => {
    if (it.note && set.has(it.note.folder)){ it.note.folder = parent; it.note.uap = now; }
  });
  persistNotes();

  /* 墓碑：告诉其他设备这些文件夹已经删了 */
  set.forEach(fid => {
    if (!FOLDER_DEL.some(d => d.id === fid)) FOLDER_DEL.push({ id: fid, uap: now });
  });

  FOLDERS = FOLDERS.filter(x => !set.has(x.id));
  saveFolders();
  if (state.folder === id) state.folder = parent;
  renderFolderPane();
  toast('已删除，笔记已移到上一层');
}

/* ============================================================
   8. 月份 / 日历 / 当天

function renderMonths(){
  const y = state.y;
  document.getElementById('months-title').textContent = y + ' 年';
  document.getElementById('months-sub').textContent = '12 个月 · 共 ' + countYear(y) + ' 篇';
  const nowM = (y === TODAY.y) ? TODAY.m : -1;
  let html = '';
  for (let m = 0; m < 12; m++){
    const c = countMonth(y, m);
    const alpha = c === 0 ? 0 : Math.min(0.15, 0.028 + c * 0.005);
    html += '<button class="month-cell' + (c === 0 ? ' empty' : '') + (m === nowM ? ' cur' : '') +
      '" data-m="' + m + '" style="background:' + (c === 0 ? 'var(--card)' : 'rgba(192,73,47,' + alpha.toFixed(3) + ')') + '">' +
      '<span class="m-num">' + (m + 1) + '<span class="m-unit">月</span></span>' +
      '<span class="m-cnt">' + (c === 0 ? '暂无' : c + ' 篇') + '</span></button>';
  }
  const grid = document.getElementById('month-grid');
  grid.innerHTML = html;
  grid.querySelectorAll('.month-cell').forEach(cell => {
    cell.addEventListener('click', () => {
      state.m = Number(cell.dataset.m);
      renderDays();
      go('s-days');
    });
  });
}

function renderDays(){
  const { y, m } = state;
  const dim = new Date(y, m + 1, 0).getDate();
  const lead = (new Date(y, m, 1).getDay() + 6) % 7;
  document.getElementById('days-title').textContent = (m + 1) + ' 月';
  document.getElementById('days-sub').textContent = y + ' 年 · ' + countMonth(y, m) + ' 篇笔记';

  const cells = [];
  for (let i = 0; i < lead; i++) cells.push({ blank:true });
  for (let d = 1; d <= dim; d++){
    const list = DATA[keyOf(y, m, d)];
    if (!list){ cells.push({ blank:true }); continue; }
    const isToday = (y === TODAY.y && m === TODAY.m && d === TODAY.d);
    const cls = ['day-cell', 'has'];
    if (list.length > 1) cls.push('multi');
    if (isToday) cls.push('today');
    cells.push({ d, cls: cls.join(' ') });
  }
  while (cells.length % 7 !== 0) cells.push({ blank:true });
  if (cells.length >= 7 && cells.slice(-7).every(c => c.blank)) cells.length -= 7;

  const grid = document.getElementById('cal-grid');
  grid.innerHTML = cells.map(c => c.blank
    ? '<div class="day-cell blank"></div>'
    : '<div class="' + c.cls + '" data-d="' + c.d + '"><span class="d-num">' + c.d + '</span><span class="d-dot"></span></div>'
  ).join('');

  grid.querySelectorAll('[data-d]').forEach(el => {
    el.addEventListener('click', () => {
      dayFrom = 's-days';
      openDay(y, m, Number(el.dataset.d));
    });
  });

  const activeDays = Object.keys(DATA).filter(k => k.startsWith(y + '-' + String(m + 1).padStart(2, '0'))).length;
  document.getElementById('cal-foot').textContent = activeDays === 0
    ? '这个月还没有记录' : '本月有 ' + activeDays + ' 天记录了笔记';

  document.getElementById('btn-prev').disabled = (y <= 2000 && m === 0);
  document.getElementById('btn-next').disabled = (y === TODAY.y && m === TODAY.m);
}

document.getElementById('btn-prev').addEventListener('click', () => {
  if (state.m === 0){ state.m = 11; state.y--; } else state.m--;
  renderDays();
});
document.getElementById('btn-next').addEventListener('click', () => {
  if (state.m === 11){ state.m = 0; state.y++; } else state.m++;
  renderDays();
});

function openDay(y, m, d){
  lastDay = { y, m, d };
  const list = DATA[keyOf(y, m, d)] || [];
  const dow = new Date(y, m, d).getDay();
  document.getElementById('day-title').textContent = (m + 1) + ' 月 ' + d + ' 日';
  document.getElementById('day-sub').textContent =
    WEEK[dow] + (list.length ? ' · ' + list.length + ' 篇笔记' : ' · 没有记录');

  const body = document.getElementById('day-body');
  if (!list.length){
    body.innerHTML = '<div class="empty-state"><div class="es-mark">·</div><p>这天还没有写笔记</p></div>';
  } else {
    body.innerHTML = list.map((n, i) => {
      const fp = pathOf(n.folder);
      const tag = fp.length ? fp[fp.length - 1].name : '未分类';
      const dk = keyOf(y, m, d);
      const rv = rvByNote(dk, n.id);
      let prog = '按曲线提醒回看';
      if (rv){
        prog = rv.done
          ? '已掌握 · 共 ' + rv.step + ' 次'
          : '第 ' + (rv.step + 1) + '/' + RV_STEPS.length + ' 次 · ' +
            (rv.dueAt <= todayKey() ? '该复习了' : dueText(rv.dueAt));
      }
      return '<article class="note-card" data-note="' + n.id + '" style="animation-delay:' + (i * 55) + 'ms">' +
        '<div class="nc-top"><span class="nc-time">' + n.time + '</span>' +
        '<span class="nc-tag">' + esc(tag) + '</span></div>' +
        '<h3 class="nc-title">' + esc(n.title) + '</h3>' +
        '<div class="rich-body" style="font-size:' + (n.fs || 14) + 'px">' + renderRich(n.html) + '</div>' +
        '<div class="nc-foot">' +
          '<button class="nc-mem' + (rv ? ' on' : '') + '" data-mem="' + n.id + '">' +
            '<svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="6" cy="6" r="4.5"/><path d="M6 3.7V6l1.6 1"/></svg>' +
            (rv ? '已加入' : '记忆') +
          '</button>' +
          '<span class="nc-prog">' + esc(prog) + '</span>' +
        '</div>' +
      '</article>';
    }).join('');
  }

  body.querySelectorAll('.note-card').forEach(c => {
    c.addEventListener('click', () => openNoteDetail(keyOf(y, m, d), c.dataset.note));
  });

  body.querySelectorAll('[data-mem]').forEach(b => {
    b.addEventListener('click', e => {
      e.stopPropagation();
      const dk = keyOf(y, m, d);
      const note = (DATA[dk] || []).find(n => n.id === b.dataset.mem);
      if (!note) return;
      const sc = body.scrollTop;
      if (rvByNote(dk, note.id)){
        leaveReview(dk, note.id);
        toast('已移出记忆');
      } else {
        const r = joinReview(dk, note);
        toast('已加入记忆 · 首次复习 ' + dueText(r.dueAt));
      }
      openDay(y, m, d);
      body.scrollTop = sc;
      refreshReviewUI();
    });
  });

  body.querySelectorAll('.rich-body img').forEach(img => {
    img.addEventListener('click', () => {
      document.getElementById('lb-img').src = img.getAttribute('src') || '';
      document.getElementById('lb').classList.add('on');
    });
  });

  body.scrollTop = 0;
  go('s-day');
}

document.getElementById('lb').addEventListener('click', function(){ this.classList.remove('on'); });

const ndEl   = document.getElementById('nd');

function openNoteDetail(dateKey, noteId){
  const note = findNote(dateKey, noteId);
  if (!note) return;
  ndCtx = { dateKey: dateKey, noteId: noteId };

  document.getElementById('nd-time').textContent = fmtDate(dateKey) + ' · ' + (note.time || '');
  document.getElementById('nd-title').textContent = note.title || '无标题';

  const fp = pathOf(note.folder);

  tags.push('<span class="nd-tag' + (fp.length ? '' : ' plain') + '">' +
    esc(fp.length ? fp.map(function(f){ return f.name; }).join(' / ') : '未分类') + '</span>');
  const rv = rvByNote(dateKey, noteId);
  if (rv){
    tags.push('<span class="nd-tag">' +
