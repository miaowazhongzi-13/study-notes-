/* ---------- 删除一条笔记 ---------- */
function deleteNote(dateKey, id){
  const uap = Date.now();

  USER_NOTES = USER_NOTES.filter(function(x){
    return !(x && x.note && x.note.id === id);
  });

  const arr = DATA[dateKey] || [];
  const idx = arr.findIndex(function(n){ return n.id === id; });
  if (idx >= 0) arr.splice(idx, 1);
  if (!arr.length) delete DATA[dateKey];

  /* 复习计划跟着撤掉，并留墓碑，免得别的设备又同步回来 */
  leaveReview(dateKey, id);

  if (!NOTE_DEL.some(function(d){ return d.id === id; })) NOTE_DEL.push({ id: id, uap: uap });
  saveNoteDel();
  persistNotes();

  renderHome();
  renderMonths();
  renderDays();
  refreshReviewUI();
  updateDock();
  if (lastDay) openDay(lastDay.y, lastDay.m, lastDay.d);
  toast('已删除');
}

  renderMonths(); renderDays();
  dayFrom = 's-days';

});

    savedRange = sel.getRangeAt(0).cloneRange();

  }

function restoreSel(){
  edRich.focus();
  if (!savedRange) return;
  try {
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(savedRange);
  } catch(e){}

function exec(cmd, val){
  restoreSel();
  try { document.execCommand('styleWithCSS', false, true); } catch(e){}
  document.execCommand(cmd, false, val == null ? null : val);
  syncActive();
}
function syncActive(){
  document.querySelectorAll('[data-cmd]').forEach(b => {
    try { b.classList.toggle('on', document.queryCommandState(b.dataset.cmd)); } catch(e){}
  });
}

document.querySelectorAll('[data-cmd]').forEach(b => {

const pickMask  = document.getElementById('pick-mask');
const pickSheet = document.getElementById('pick-sheet');
const pickList  = document.getElementById('pick-list');

document.getElementById('ed-folder').addEventListener('click', openPick);
function openPick(){
  const rows = flatTree(null, 0, []);
  let html = '<button class="fo-row' + (edFolder ? '' : ' on') + '" data-fid="">' +
    '<span class="fo-ind">·</span><span>未分类</span></button>';
  html += rows.map(r =>
    '<button class="fo-row' + (r.id === edFolder ? ' on' : '') + '" data-fid="' + r.id + '" style="padding-left:' + (10 + r.depth * 16) + 'px">' +
      '<span class="fo-ind">' + (r.depth ? '└' : '▤') + '</span><span>' + esc(r.name) + '</span></button>'
  ).join('');
  pickList.innerHTML = html;
  pickList.querySelectorAll('.fo-row').forEach(b => {
    b.addEventListener('click', () => {
      edFolder = b.dataset.fid || null;
      document.getElementById('ed-folder-path').textContent = edFolder ? pathText(edFolder) : '未分类';
      closePick();
    });
  });
  pickMask.classList.add('on');
  pickSheet.classList.add('on');
}
function closePick(){
  pickMask.classList.remove('on');
  pickSheet.classList.remove('on');
}
pickMask.addEventListener('click', closePick);

let edEdit = null;      /* null = 新建；{ dateKey, noteId } = 改这一篇 */

function openEditor(preFolder, editCtx){
  edEdit = editCtx || null;
  edFontSize = 15;
  savedRange = null;
  clearImgSel();
  document.querySelectorAll('.cw').forEach(x => x.classList.remove('on'));

  const modeEl = document.getElementById('ed-mode');

  /* ---- 编辑已有笔记：把内容填回编辑器 ---- */
  if (edEdit){
    const n = findNote(edEdit.dateKey, edEdit.noteId);
    if (n){
      edFolder = n.folder || null;
      edFontSize = n.fs || 15;
      edTitle.value = n.title || '';
      edRich.innerHTML = renderRich(n.html);
      edRich.style.fontSize = edFontSize + 'px';
      edSave.disabled = !edTitle.value.trim();

      const rv = rvByNote(edEdit.dateKey, edEdit.noteId);
      edJoin = !!rv;
      edMemInp.checked = !!rv;
      edMemRow.classList.toggle('on', !!rv);
      edMemSub.textContent = rv
        ? ('已经在曲线里 · 第 ' + (rv.step + 1) + '/' + RV_STEPS.length + ' 次')
        : MEM_SUB_OFF;

      document.getElementById('ed-folder-path').textContent = edFolder ? pathText(edFolder) : '未分类';
      modeEl.textContent = '编辑笔记';
      ed.classList.add('on');
      edBody.scrollTop = 0;
      return;
    }
    edEdit = null;
  }

  /* ---- 新建 ---- */
  edFolder = preFolder || state.folder || null;
  edTitle.value = '';
  edRich.innerHTML = '';
  edRich.style.fontSize = '15px';
  edSave.disabled = true;
  edJoin = false;
  edMemInp.checked = false;
  edMemRow.classList.remove('on');
  edMemSub.textContent = MEM_SUB_OFF;
  document.getElementById('ed-folder-path').textContent = edFolder ? pathText(edFolder) : '未分类';
  modeEl.textContent = '新建笔记';
  ed.classList.add('on');
  edBody.scrollTop = 0;
  setTimeout(() => edTitle.focus(), 380);
}
function closeEditor(){
  ed.classList.remove('on');
  clearImgSel();
  edTitle.blur();
  edRich.blur();
}

document.getElementById('btn-add').addEventListener('click', () => openEditor(null));
document.getElementById('ed-cancel').addEventListener('click', closeEditor);
edTitle.addEventListener('input', () => {
  edSave.disabled = edTitle.value.trim().length === 0;
});

/* ============================================================
   11. 图片
   ============================================================ */
const fileCam = document.getElementById('file-cam');
document.getElementById('tb-img').addEventListener('mousedown', e => e.preventDefault());
document.getElementById('tb-img').addEventListener('click', () => fileCam.click());

fileCam.addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 1100;
      let w = img.width, h = img.height;
      if (w > h && w > max){ h = Math.round(h * max / w); w = max; }
      else if (h >= w && h > max){ w = Math.round(w * max / h); h = max; }
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      insertImage(cv.toDataURL('image/jpeg', 0.68));
      toast('已插入图片');
    };
    img.onerror = () => toast('这张图读不了');
    img.src = reader.result;
  };
  reader.readAsDataURL(f);
  e.target.value = '';
});

function insertImage(src){
  restoreSel();
  const html = '<img src="' + src + '" alt="" draggable="false"><p><br></p>';
  let ok = false;
  try { ok = document.execCommand('insertHTML', false, html); } catch(e){ ok = false; }
  if (!ok) edRich.innerHTML += html;
  savedRange = null;
}

/* ---- 图片：选中、拖角改大小、锁定 ---- */
const imgOv  = document.getElementById('img-ov');
const ioH    = document.getElementById('io-h');
const imgBar = document.getElementById('img-bar');
const ibSize = document.getElementById('ib-size');
const ibLock = document.getElementById('ib-lock');
let selImg = null, ioDrag = false, ioX = 0, ioW = 0, ioMax = 0;

function sizeLbl(){
  ibSize.textContent = selImg ? (Math.round(selImg.getBoundingClientRect().width) + ' px') : '—';
}
function placeOverlay(){
  if (!selImg){ imgOv.classList.remove('on'); return; }
  const er = ed.getBoundingClientRect();
  const r  = selImg.getBoundingClientRect();
  const br = edBody.getBoundingClientRect();
  if (r.bottom < br.top + 2 || r.top > br.bottom - 2){ imgOv.classList.remove('on'); return; }
  imgOv.classList.add('on');
  imgOv.style.left   = (r.left - er.left) + 'px';
  imgOv.style.top    = (r.top  - er.top)  + 'px';
  imgOv.style.width  = r.width  + 'px';
  imgOv.style.height = r.height + 'px';
}
function selectImg(img){
  selImg = img;
  const locked = img.dataset.lock === '1';
  imgOv.classList.toggle('locked', locked);
  ioH.style.display = locked ? 'none' : 'block';
  ibLock.textContent = locked ? '解锁' : '锁定';
  ibLock.classList.toggle('on', locked);
  imgBar.classList.add('on');
  sizeLbl();
  placeOverlay();
}
function clearImgSel(){
  selImg = null;
  imgBar.classList.remove('on');
  imgOv.classList.remove('on');
}

edRich.addEventListener('pointerdown', e => {
  const img = e.target && e.target.tagName === 'IMG' ? e.target : null;
  if (img){ e.preventDefault(); selectImg(img); }
  else clearImgSel();
});
edRich.addEventListener('dragstart', e => {
  if (e.target && e.target.tagName === 'IMG') e.preventDefault();
});

ioH.addEventListener('pointerdown', e => {
  if (!selImg || selImg.dataset.lock === '1') return;
  e.preventDefault();
  ioDrag = true;
  ioX = e.clientX;
  ioW = selImg.getBoundingClientRect().width;
  ioMax = edRich.clientWidth;
  try { ioH.setPointerCapture(e.pointerId); } catch(err){}
});
ioH.addEventListener('pointermove', e => {
  if (!ioDrag || !selImg) return;
  const w = Math.max(56, Math.min(ioMax, ioW + (e.clientX - ioX)));
  selImg.style.width = Math.round(w) + 'px';
  selImg.style.height = 'auto';
  placeOverlay();
  sizeLbl();
});
ioH.addEventListener('pointerup', () => { ioDrag = false; });
ioH.addEventListener('pointercancel', () => { ioDrag = false; });

function imgQuick(ratio){
  if (!selImg) return;
  selImg.style.width = Math.round(edRich.clientWidth * ratio) + 'px';
  selImg.style.height = 'auto';
  placeOverlay(); sizeLbl();
}
ibLock.addEventListener('mousedown', e => e.preventDefault());
ibLock.addEventListener('click', () => {
  if (!selImg) return;
  const locked = selImg.dataset.lock === '1';
  if (locked) delete selImg.dataset.lock; else selImg.dataset.lock = '1';
  selectImg(selImg);
  toast(locked ? '已解锁，可以拖角改大小' : '已锁定，尺寸不会再被动到');
});
document.getElementById('ib-full').addEventListener('mousedown', e => e.preventDefault());
document.getElementById('ib-full').addEventListener('click', () => imgQuick(1));
document.getElementById('ib-half').addEventListener('mousedown', e => e.preventDefault());
document.getElementById('ib-half').addEventListener('click', () => imgQuick(0.5));
document.getElementById('ib-del').addEventListener('mousedown', e => e.preventDefault());
document.getElementById('ib-del').addEventListener('click', () => {
  if (!selImg) return;
  selImg.remove();
  clearImgSel();
  toast('已删除图片');
});

edBody.addEventListener('scroll', placeOverlay);
window.addEventListener('resize', placeOverlay);

/* ============================================================
   12. 画板
   ============================================================ */
const board  = document.getElementById('board');
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
let drawing = false, lastX = 0, lastY = 0;
let penColor = '#1B1A17', penSize = 2.4;
let history = [];

function sizeCanvas(){
  const r = canvas.parentElement.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(r.width * dpr);
  canvas.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#FBFAF6';
  ctx.fillRect(0, 0, r.width, r.height);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
}
function pushHistory(){
  try { history.push(ctx.getImageData(0, 0, canvas.width, canvas.height)); } catch(e){}
  if (history.length > 12) history.shift();
}
function pos(e){
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  drawing = true; pushHistory();
  const p = pos(e);
  lastX = p.x; lastY = p.y;
  ctx.strokeStyle = penColor; ctx.lineWidth = penSize;
  ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + 0.1, p.y + 0.1); ctx.stroke();
});
canvas.addEventListener('pointermove', e => {
  if (!drawing) return;
  const p = pos(e);
  ctx.strokeStyle = penColor; ctx.lineWidth = penSize;
  ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(p.x, p.y); ctx.stroke();
  lastX = p.x; lastY = p.y;
});
canvas.addEventListener('pointerup', () => { drawing = false; });
canvas.addEventListener('pointercancel', () => { drawing = false; });

document.querySelectorAll('.swatch').forEach(s => {
  s.addEventListener('click', () => {
    penColor = s.dataset.color;
    document.querySelectorAll('.swatch').forEach(x => x.classList.toggle('on', x === s));
  });
});
document.querySelectorAll('.size-dot').forEach(s => {
  s.addEventListener('click', () => {
    penSize = Number(s.dataset.size);
    document.querySelectorAll('.size-dot').forEach(x => x.classList.toggle('on', x === s));
  });
});

document.getElementById('tb-draw').addEventListener('mousedown', e => e.preventDefault());
document.getElementById('tb-draw').addEventListener('click', () => {
  history = [];
  board.classList.add('on');
  requestAnimationFrame(sizeCanvas);
});
document.getElementById('bd-cancel').addEventListener('click', () => board.classList.remove('on'));
document.getElementById('bd-clear').addEventListener('click', () => {
  pushHistory();
  const r = canvas.parentElement.getBoundingClientRect();
  ctx.fillStyle = '#FBFAF6';
  ctx.fillRect(0, 0, r.width, r.height);
});
document.getElementById('bd-undo').addEventListener('click', () => {
  if (!history.length) return;
  ctx.putImageData(history.pop(), 0, 0);
});
document.getElementById('bd-done').addEventListener('click', () => {
  const r = canvas.parentElement.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const tmp = document.createElement('canvas');
  tmp.width = Math.round(r.width * dpr);
  tmp.height = Math.round(r.height * dpr);
  tmp.getContext('2d').drawImage(canvas, 0, 0, tmp.width, tmp.height);
  board.classList.remove('on');
  insertImage(tmp.toDataURL('image/jpeg', 0.72));
  toast('已插入手写图');
});
window.addEventListener('resize', () => {
  if (board.classList.contains('on')) sizeCanvas();
});

/* ============================================================
   12.5 记忆复习（艾宾浩斯）
   ============================================================ */
const RV_STEPS = [1, 2, 4, 7, 15, 30, 60];   /* 单位：天，共 7 次 */
const LS_RV = 'wb_notes_review_v1';
const LS_RVDEL = 'wb_notes_rvdel_v1';
const LS_REM = 'wb_rv_remind';

let REVIEWS = [];
try { REVIEWS = JSON.parse(localStorage.getItem(LS_RV) || '[]'); } catch(e){ REVIEWS = []; }
if (!Array.isArray(REVIEWS)) REVIEWS = [];

let RV_DEL = [];
try { RV_DEL = JSON.parse(localStorage.getItem(LS_RVDEL) || '[]'); } catch(e){ RV_DEL = []; }
if (!Array.isArray(RV_DEL)) RV_DEL = [];

function saveReviews(){
  try {
    localStorage.setItem(LS_RV, JSON.stringify(REVIEWS));
    localStorage.setItem(LS_RVDEL, JSON.stringify(RV_DEL));
    syncSoon();
  } catch(e){}
}
function todayKey(){ return keyOf(TODAY.y, TODAY.m, TODAY.d); }
function shiftDay(key, n){
  const p = key.split('-').map(Number);
  const d = new Date(p[0], p[1] - 1, p[2] + n);
  return keyOf(d.getFullYear(), d.getMonth(), d.getDate());
}
function findNote(dateKey, id){
  return (DATA[dateKey] || []).find(n => n.id === id) || null;
}
function rvByNote(dateKey, id){
  return REVIEWS.find(r => r.dateKey === dateKey && r.noteId === id) || null;
}
function rvRemain(r){ return Math.max(0, RV_STEPS.length - r.step); }
function rvDue(){ return REVIEWS.filter(r => !r.done && r.dueAt <= todayKey()).sort((a, b) => a.dueAt.localeCompare(b.dueAt)); }
function rvActive(){ return REVIEWS.filter(r => !r.done).sort((a, b) => a.dueAt.localeCompare(b.dueAt)); }
function rvDoneList(){ return REVIEWS.filter(r => r.done); }

function dueText(key){
  const t = todayKey();
  if (key < t){
    const d = Math.round((new Date(key) - new Date(t)) / 86400000);
    return '逾期 ' + Math.abs(d) + ' 天';
  }
  if (key === t) return '今天';
  const p = key.split('-');
  return Number(p[1]) + ' 月 ' + Number(p[2]) + ' 日';
}

function joinReview(dateKey, note){
  const has = rvByNote(dateKey, note.id);
  if (has) return has;
  const rec = {
    id: 'r' + Date.now().toString(36) + Math.floor(Math.random() * 999).toString(36),
    dateKey, noteId: note.id,
    title: note.title, folder: note.folder || null,
    startedAt: todayKey(),
    step: 0,
    dueAt: shiftDay(todayKey(), RV_STEPS[0]),
    logs: [], done: false,
    uap: Date.now()
  };
  REVIEWS.push(rec);
  saveReviews();
  return rec;
}
function leaveReview(dateKey, noteId){
  const cur = rvByNote(dateKey, noteId);
  if (cur && !RV_DEL.some(d => d.id === cur.id)) RV_DEL.push({ id: cur.id, uap: Date.now() });
  REVIEWS = REVIEWS.filter(r => !(r.dateKey === dateKey && r.noteId === noteId));
  saveReviews();
}

/* ---- 首页提示条 + dock 角标 ---- */
function renderMemBar(){
  const bar = document.getElementById('mem-bar');
  const due = rvDue(), act = rvActive(), dn = rvDoneList();
  const t = document.getElementById('mb-t'), s = document.getElementById('mb-s');
  bar.classList.toggle('hot', due.length > 0);
  if (!REVIEWS.length){
    t.textContent = '把笔记加进记忆';
    s.textContent = '按艾宾浩斯曲线安排 7 次回看';
  } else if (due.length){
    t.textContent = '今天要复习 ' + due.length + ' 篇';
    s.textContent = '共 ' + act.length + ' 篇在曲线里 · 最早一篇第 ' + (due[0].step + 1) + '/' + RV_STEPS.length + ' 次';
  } else if (act.length){
    t.textContent = '今天没有要复习的';
    s.textContent = '下一篇 ' + dueText(act[0].dueAt) + ' · 共 ' + act.length + ' 篇在记忆里';
  } else {
    t.textContent = '全部进长期记忆了';
    s.textContent = '已掌握 ' + dn.length + ' 篇 · 不再提醒';
  }
}
function refreshReviewUI(){
  const due = rvDue().length;
  const badge = document.getElementById('dm-badge');
  const btn = document.getElementById('btn-mem');
  if (due > 0){
    badge.hidden = false;
    badge.textContent = due > 99 ? '99+' : String(due);

    badge.hidden = true;
    btn.classList.remove('has');

  renderMemBar();
  if (document.getElementById('s-review').classList.contains('active')) renderReview();

/* ---- 遗忘曲线示意 ---- */
function curveSVG(){
  const W = 320, H = 140, L = 12, R = 12, TOP = 16, BOT = 98;
  const n = RV_STEPS.length;
  const seg = (W - L - R) / n;
  let d = '';
  for (let i = 0; i < n; i++){
    const x0 = L + i * seg, x1 = x0 + seg;
    const drop = Math.max(0.2, 0.8 - i * 0.1);
    for (let s = 0; s <= 10; s++){
      const u = s / 10;
      const x = x0 + (x1 - x0) * u;
      const y = BOT - (BOT - TOP) * (1 - drop * Math.pow(u, 1.45));
      d += (i === 0 && s === 0 ? 'M' : 'L') + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
    }
  }
  let dots = '', labels = '';
  for (let i = 0; i < n; i++){
    const x = L + (i + 1) * seg;
    const drop = Math.max(0.2, 0.8 - i * 0.1);
    const y = TOP + (BOT - TOP) * drop;
    dots += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="3" fill="#C0492F" stroke="#F7F5F0" stroke-width="1.6"/>';
    labels += '<text x="' + x.toFixed(1) + '" y="' + (H - 5) + '" font-size="8.4" fill="#9C978D" text-anchor="middle" font-family="Georgia, serif">' + RV_STEPS[i] + '天</text>';
  }
  return '<svg viewBox="0 0 ' + W + ' ' + H + '">' +
    '<line x1="' + L + '" y1="' + TOP + '" x2="' + (W - R) + '" y2="' + TOP + '" stroke="#EDE9DF" stroke-width="1" stroke-dasharray="3 3"/>' +
    '<line x1="' + L + '" y1="' + BOT + '" x2="' + (W - R) + '" y2="' + BOT + '" stroke="#E9E5DB" stroke-width="1"/>' +
    '<path d="' + d + '" fill="none" stroke="#C0492F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>' +
    dots + labels + '</svg>';
}

/* ---- 复习单行 ---- */
function rvRow(r){
  const isDue = !r.done && r.dueAt <= todayKey();
  const steps = Array.from({ length: RV_STEPS.length }, (_, i) =>
    '<i class="' + (i < r.step ? 'on' : '') + '"></i>').join('');
  const folder = r.folder ? pathText(r.folder) : '未分类';
  const meta = r.done
    ? ('已掌握 · 共复习 ' + r.step + ' 次 · ' + folder)
    : ('第 ' + (r.step + 1) + '/' + RV_STEPS.length + ' 次 · 还要看 ' + rvRemain(r) + ' 次 · ' + folder);
  return '<div class="rv-row' + (isDue ? ' due' : '') + '">' +
    '<div class="rr-top"><span class="rr-title">' + esc(r.title) + '</span>' +
    '<span class="rr-due' + (isDue ? ' hot' : '') + '">' + (r.done ? '完成' : dueText(r.dueAt)) + '</span></div>' +
    '<div class="rr-meta">' + esc(meta) + '</div>' +
    '<div class="rr-foot"><span class="rr-dots">' + steps + '</span>' +
    (r.done ? '' : '<button class="rr-go' + (isDue ? '' : ' ghost') + '" data-rv="' + r.id + '">' + (isDue ? '复习' : '提前看') + '</button>') +
    '</div></div>';
}

/* ---- 复习中心 ---- */
function renderReview(){
  const due = rvDue(), act = rvActive(), dn = rvDoneList();
  document.getElementById('rv-sub').textContent = REVIEWS.length
    ? ('在曲线里 ' + act.length + ' 篇 · 今天待复习 ' + due.length + ' 篇')
    : '还没有笔记加入记忆';
  document.getElementById('rv-stats').innerHTML =
    '<div class="rs-cell' + (due.length ? ' hot' : '') + '"><b>' + due.length + '</b><span>今天待复习</span></div>' +
    '<div class="rs-cell"><b>' + act.length + '</b><span>进行中</span></div>' +
    '<div class="rs-cell"><b>' + dn.length + '</b><span>已掌握</span></div>';

  document.getElementById('rv-curve').innerHTML = curveSVG() +
    '<p class="rv-cap">每次复习都把记忆拉回顶端，间隔越拉越长。7 次之后进入长期记忆，不再提醒。</p>';

  document.getElementById('rem-inp').checked = localStorage.getItem(LS_REM) === '1';

  let html = '';
  if (!act.length && !dn.length){
    html = '<div class="empty-state"><div class="es-mark">·</div><p>还没有笔记加入记忆<br>打开一篇笔记，点底部的「记忆」</p></div>';
  } else {
    if (due.length) html += '<p class="section-lbl">今天该复习</p>' + due.map(rvRow).join('');
    const later = act.filter(r => r.dueAt > todayKey());
    if (later.length) html += '<p class="section-lbl">接下来</p>' + later.map(rvRow).join('');
    if (dn.length) html += '<p class="section-lbl">已掌握</p>' + dn.slice(0, 12).map(rvRow).join('');
  }
  const box = document.getElementById('rv-list');
  box.innerHTML = html;
  box.querySelectorAll('[data-rv]').forEach(b => {
    b.addEventListener('click', () => {
      const r = REVIEWS.find(x => x.id === b.dataset.rv);
      if (r) openReview(r);
    });
  });
}

/* ---- 复习卡 ---- */
let rvCur = null;

function openReview(r){
  const note = findNote(r.dateKey, r.noteId);
  if (!note){ toast('这篇笔记已经不在了'); return; }
  rvCur = r;
  document.getElementById('rv-step').textContent = r.done
    ? '已完成' : ('第 ' + (r.step + 1) + ' / ' + RV_STEPS.length + ' 次');
  const folder = r.folder ? pathText(r.folder) : '未分类';
  const dots = Array.from({ length: RV_STEPS.length }, (_, i) =>
    '<i class="' + (i < r.step ? 'on' : (i === r.step ? 'cur' : '')) + '"></i>').join('');
  document.getElementById('rv-body').innerHTML =
    '<span class="rv-tag">' + esc(folder) + ' · ' + fmtDate(r.dateKey) + '</span>' +
    '<h3 class="rv-h">' + esc(note.title) + '</h3>' +
    '<div class="rv-note" style="font-size:' + (note.fs || 14) + 'px">' + renderRich(note.html) + '</div>' +
    '<div class="rv-dots">' + dots + '</div>' +
    '<p class="rv-hint">' + (r.done
      ? '这篇已经进长期记忆了。'
      : ('看完先自己回想一遍再往下点。这一轮还剩 ' + rvRemain(r) + ' 次。')) + '</p>';
  document.getElementById('rv-body').scrollTop = 0;
  document.getElementById('rv').classList.add('on');
}

function answerReview(ok){
  if (!rvCur) return;
  const r = rvCur;
  r.logs.push({ at: todayKey(), ok: !!ok });
  if (ok){
    r.step = Math.min(RV_STEPS.length, r.step + 1);
    if (r.step >= RV_STEPS.length){
      r.done = true;
    } else {
      r.dueAt = shiftDay(todayKey(), RV_STEPS[r.step]);
    }
  } else {
    r.step = Math.max(0, r.step - 1);
    r.dueAt = shiftDay(todayKey(), 1);
  }
  r.uap = Date.now();
  saveReviews();
  const finished = r.done;
  rvCur = null;
  document.getElementById('rv').classList.remove('on');
  refreshReviewUI();
  toast(finished ? '这篇进长期记忆了' : (ok ? '记住了 · 下次 ' + dueText(r.dueAt) : '没关系，明天再来一次'));
  const next = rvDue()[0];
  if (next) setTimeout(() => { if (!rvCur) openReview(next); }, 460);
}

async function pushAll(){
  if (!cloud || !SYNC.user || SYNC.busy) return;
  SYNC.busy = true; setSyncUI();
  try {
    const nRows = [];
    for (const it of USER_NOTES){
      const n = it && it.note;
      if (!n || !n.id) continue;
      const uap = n.uap || 0;
      if (uap <= (PUSHED.get('n:' + n.id) || 0)) continue;
      const html = await dehydrate(n.html || '');
      if (html !== n.html){
        n.html = html;
        try { localStorage.setItem(LS_NOTES, JSON.stringify(USER_NOTES)); } catch(e){}
      }
      nRows.push({
        client_id: n.id, date_key: it.date, time_label: n.time || null,
        folder_id: n.folder || null, title: n.title || '', html: n.html || '',
        plain_text: n.text || '', font_size: n.fs || 14, deleted: false, uap
      });
    }

    /* 删除也要推到云端，否则别的设备下次同步又把它带回来 */
    NOTE_DEL.forEach(d => {
      if (d.uap <= (PUSHED.get('n:' + d.id) || 0)) return;
      nRows.push({
        client_id: d.id, date_key: '1970-01-01', time_label: null,
        folder_id: null, title: '(deleted)', html: '', plain_text: '',
        font_size: 14, deleted: true, uap: d.uap
      });
    });

    const fRows = [];    FOLDERS.forEach(f => {
      const uap = f.uap || 0;
      if (uap <= (PUSHED.get('f:' + f.id) || 0)) return;
      fRows.push({ client_id: f.id, name: f.name, parent_id: f.parent || null, sort_order: 0, deleted: false, uap });
    });
    FOLDER_DEL.forEach(d => {
      if (d.uap <= (PUSHED.get('f:' + d.id) || 0)) return;
      fRows.push({ client_id: d.id, name: '(deleted)', parent_id: null, sort_order: 0, deleted: true, uap: d.uap });
    });

    const rRows = [];
    REVIEWS.forEach(r => {
      const uap = r.uap || 0;
      if (uap <= (PUSHED.get('r:' + r.id) || 0)) return;
      rRows.push({
        client_id: r.id, date_key: r.dateKey || null, note_id: r.noteId || null,
        title: r.title || '', folder_id: r.folder || null, started_at: r.startedAt || null,
        step: r.step || 0, due_at: r.dueAt || null, logs: r.logs || [],
        done: !!r.done, deleted: false, uap
      });
    });
    RV_DEL.forEach(d => {
      if (d.uap <= (PUSHED.get('r:' + d.id) || 0)) return;
      rRows.push({
        client_id: d.id, date_key: null, note_id: null, title: '(deleted)', folder_id: null,
        started_at: null, step: 0, due_at: null, logs: [], done: false, deleted: true, uap: d.uap
      });
    });

    const jobs = [];
    if (nRows.length) jobs.push(['notes', 'n', nRows]);
    if (fRows.length) jobs.push(['folders', 'f', fRows]);
    if (rRows.length) jobs.push(['reviews', 'r', rRows]);

    for (const [table, pre, rows] of jobs){
      for (let i = 0; i < rows.length; i += 80){
        const chunk = rows.slice(i, i + 80);
        const res = await cloud.database.from(table).upsert(chunk, { onConflict: 'owner_id,client_id' });
        if (res.error) throw new Error(res.error.message || '写入失败');
        chunk.forEach(x => PUSHED.set(pre + ':' + x.client_id, x.uap));
      }
    }

    SYNC.err = '';
    SYNC.lastSync = Date.now();
  } catch(e){
    SYNC.err = (e && e.message) ? e.message : '同步失败，稍后会自动重试';
  } finally {
    SYNC.busy = false;
    setSyncUI();
    renderAccount();
  }
}

/* ---------- 拉取 + 合并 ---------- */
function mergeNotes(rows){
  const byId = new Map();
  USER_NOTES.forEach(it => { if (it && it.note && it.note.id) byId.set(it.note.id, it); });
  let changed = false;
  rows.forEach(r => {
    if (!r || !r.client_id) return;
    /* 早期版本的示例笔记，别再拉回来了 */
    if (/^n\d{6,}$/.test(r.client_id)) return;
    const cur = byId.get(r.client_id);
    if (r.deleted){
      if (cur && (cur.note.uap || 0) < r.uap){
        USER_NOTES = USER_NOTES.filter(x => x !== cur);
        byId.delete(r.client_id);
        if (!NOTE_DEL.some(d => d.id === r.client_id)) NOTE_DEL.push({ id: r.client_id, uap: r.uap });
        changed = true;
      }
      return;
    }
    if (!cur){
      const n = {
        id: r.client_id, time: r.time_label || '12:00', folder: r.folder_id || null,
        title: r.title || '', html: r.html || '', text: r.plain_text || '',
        fs: r.font_size || 14, uap: r.uap
      };
      const e = { date: r.date_key || todayKey(), note: n };
      USER_NOTES.push(e);
      byId.set(n.id, e);
      changed = true;
    } else if ((cur.note.uap || 0) < r.uap){
      const n = cur.note;
      n.time = r.time_label || n.time;
      n.folder = r.folder_id || null;
      n.title = r.title != null ? r.title : n.title;
      n.html = r.html || '';
      n.text = r.plain_text || '';
      n.fs = r.font_size || 14;
      n.uap = r.uap;
      cur.date = r.date_key || cur.date;
      changed = true;
    }
  });
  return changed;
}

function mergeFolders(rows){
  const byId = new Map(FOLDERS.map(f => [f.id, f]));
  let changed = false;
  rows.forEach(r => {
    if (!r || !r.client_id) return;
    const cur = byId.get(r.client_id);
    if (r.deleted){
      if (cur && (cur.uap || 0) < r.uap){
        FOLDERS = FOLDERS.filter(f => f.id !== r.client_id);
        byId.delete(r.client_id);
        if (!FOLDER_DEL.some(d => d.id === r.client_id)) FOLDER_DEL.push({ id: r.client_id, uap: r.uap });
        changed = true;
      }
      return;
    }
    if (!cur){
      const f = { id: r.client_id, name: r.name || '未命名', parent: r.parent_id || null, uap: r.uap };
      FOLDERS.push(f);
      byId.set(f.id, f);
      changed = true;
    } else if ((cur.uap || 0) < r.uap){
      cur.name = r.name || cur.name;
      cur.parent = r.parent_id || null;
      cur.uap = r.uap;
      changed = true;
    }
  });
  return changed;
}

function mergeReviews(rows){
  const byId = new Map(REVIEWS.map(r => [r.id, r]));
  let changed = false;
  rows.forEach(r => {
    if (!r || !r.client_id) return;
    const cur = byId.get(r.client_id);
    if (r.deleted){
      if (cur && (cur.uap || 0) < r.uap){
        REVIEWS = REVIEWS.filter(x => x.id !== r.client_id);
        byId.delete(r.client_id);
        if (!RV_DEL.some(d => d.id === r.client_id)) RV_DEL.push({ id: r.client_id, uap: r.uap });
        changed = true;
      }
      return;
    }
    if (!cur){
      const rec = {
        id: r.client_id, dateKey: r.date_key, noteId: r.note_id, title: r.title || '',
        folder: r.folder_id || null, startedAt: r.started_at || todayKey(),
        step: r.step || 0, dueAt: r.due_at || shiftDay(todayKey(), 1),
        logs: r.logs || [], done: !!r.done, uap: r.uap
      };
      REVIEWS.push(rec);
      byId.set(rec.id, rec);
      changed = true;
    } else if ((cur.uap || 0) < r.uap){
      cur.dateKey = r.date_key; cur.noteId = r.note_id; cur.title = r.title || '';
      cur.folder = r.folder_id || null; cur.startedAt = r.started_at || cur.startedAt;
      cur.step = r.step || 0; cur.dueAt = r.due_at || cur.dueAt;
      cur.logs = r.logs || []; cur.done = !!r.done; cur.uap = r.uap;
      changed = true;
    }
  });
  return changed;
}

async function pullAll(){
  if (!cloud || !SYNC.user) return false;

    cloud.database.from('notes').select('*'),

  if (n.error) throw new Error(n.error.message || '读取笔记失败');

function switchAuthMode(m){

async function sendOtpCode(){
  if (!cloud){ authErr('云端服务没加载成功，检查一下网络'); return; }
  const who = document.getElementById('a-who').value.trim();
  if (authMode === 'phone'){
    if (!/^1\d{10}$/.test(who)){ authErr('请输入正确的 11 位手机号'); return; }
  } else {
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(who)){ authErr('请输入正确的邮箱地址'); return; }
  }
  authErr('');
  const btn = document.getElementById('a-send');
  btn.disabled = true;
  btn.textContent = '发送中…';
  try {
    const res = authMode === 'phone'
      ? await cloud.auth.sendOtp({ phone: who })
      : await cloud.auth.sendOtp({ email: who });
    if (res.error){
      authErr(res.error.message || '验证码发送失败');
      btn.disabled = false; btn.textContent = '获取验证码';
      return;
    }
    pendingOtp = {
      who, mode: authMode,
      id: res.data.verificationId,
      existing: res.data.isExistingUser
    };
    let left = 60;
    btn.textContent = left + ' 秒后重发';
    const timer = setInterval(() => {
      left -= 1;
      if (left <= 0){
        clearInterval(timer);
        btn.disabled = false;
        btn.textContent = '重新获取';
      } else btn.textContent = left + ' 秒后重发';
    }, 1000);
    document.getElementById('a-code').focus();
  } catch(e){
    authErr('验证码发送失败，检查一下网络');
    btn.disabled = false; btn.textContent = '获取验证码';
  }
}

async function submitOtp(){
  if (!cloud){ authErr('云端服务没加载成功'); return; }
  const who = document.getElementById('a-who').value.trim();
  const token = document.getElementById('a-code').value.trim();
  if (!pendingOtp || pendingOtp.who !== who){
    authErr('请先点「获取验证码」');
    return;
  }
  if (!token){ authErr('请输入验证码'); return; }
  authErr('');
  const btn = document.getElementById('a-go');
  btn.disabled = true; btn.textContent = '登录中…';
  try {
    const payload = {
      [pendingOtp.mode === 'phone' ? 'phone' : 'email']: pendingOtp.who,
      verificationId: pendingOtp.id,
      isExistingUser: pendingOtp.existing,
      token
    };
    const res = await cloud.auth.verifyOtp(payload);
    if (res.error){
      authErr(res.error.message || '验证码不对或已过期');
      btn.disabled = false; btn.textContent = '登录 / 注册';
      return;
    }
    pendingOtp = null;
    const ok = await onSignedIn();
    if (!ok) authErr('登录状态没拿到，请重试一次');
  } catch(e){
    authErr('登录失败，检查一下网络');
  } finally {
    btn.disabled = false; btn.textContent = '登录 / 注册';
  }
}

/* ---------- 账号页 ---------- */
function maskId(u){
  if (!u) return '已登录';
  if (u.phone){
    const p = String(u.phone);
    return p.length > 6 ? p.slice(0, 3) + '****' + p.slice(-2) : p;
  }
  if (u.email){
    const [a, b] = String(u.email).split('@');
    return (a.length > 2 ? a.slice(0, 2) + '***' : a) + '@' + b;
  }
  return u.name || '已登录';
}

function timeAgo(ts){
  if (!ts) return '还没同步过';
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return '刚刚';
  if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
  if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
  return Math.floor(s / 86400) + ' 天前';
}

function renderAccount(){
  const body = document.getElementById('acct-body');
  if (!body) return;
  const sub = document.getElementById('acct-sub');
  if (!SYNC.user){
    if (sub) sub.textContent = '未登录 · 只在这台设备上';
    body.innerHTML =
      '<div class="acct-card">' +
        '<div class="acct-who"><div class="acct-ava">?</div>' +
          '<div><div class="acct-name">还没登录</div>' +
          '<div class="acct-sid">数据只存在这台设备的浏览器里</div></div>' +
        '</div>' +
        '<p class="note-tip" style="margin-top:0">登录之后，笔记、文件夹、复习进度会存到云端。手机、平板、电脑用同一个账号登录，看到的就是同一份内容。</p>' +
      '</div>' +
      '<button class="btn-main" id="acct-login">登录 / 注册</button>' +
      '<p class="note-tip">不登录也能正常记笔记，只是换设备看不到，清浏览器数据也会丢。</p>';
    const b = document.getElementById('acct-login');
    if (b) b.addEventListener('click', openAuth);
    return;
  }
  const u = SYNC.user;
  if (sub) sub.textContent = '已登录 · ' + (SYNC.busy ? '同步中…' : timeAgo(SYNC.lastSync) + '同步');
  const stateTxt = SYNC.busy ? '同步中…' : (SYNC.err ? '同步出错' : '已同步');
  body.innerHTML =
    '<div class="acct-card">' +
      '<div class="acct-who">' +
        '<div class="acct-ava">' + esc(String(u.name || maskId(u)).slice(0, 1).toUpperCase()) + '</div>' +
        '<div><div class="acct-name">' + esc(u.name || '我的账号') + '</div>' +
        '<div class="acct-sid">' + esc(maskId(u)) + '</div></div>' +
      '</div>' +
      '<div class="row"><b>同步状态</b><span class="rv">' + stateTxt + '</span></div>' +
      '<div class="row"><b>上次同步</b><span class="rv">' + timeAgo(SYNC.lastSync) + '</span></div>' +
      '<div class="row"><b>已同步笔记</b><span class="rv">' + USER_NOTES.length + ' 篇</span></div>' +
    '</div>' +
    (SYNC.err ? '<p class="note-tip" style="color:var(--accent)">' + esc(SYNC.err) + '</p>' : '') +
    '<button class="btn-main" id="acct-sync">立即同步</button>' +
    '<button class="btn-ghost" id="acct-out">退出登录</button>' +
    '<p class="note-tip">换设备：在那台设备上打开同一个网址，用这个账号登录，数据会自动拉下来。<br>' +
    '两台设备同时改同一条时，以最后修改的为准；删除文件夹的动作为了不误删，会以「删除时间更晚」的一方为准。</p>';

  document.getElementById('acct-sync').addEventListener('click', async () => {
    if (SYNC.busy) return;
    toast('正在同步…');
    await syncNow();
    toast(SYNC.err ? '同步失败：' + SYNC.err : '已是最新');
  });
  document.getElementById('acct-out').addEventListener('click', async () => {
    try { await cloud.auth.signOut(); } catch(e){}
    SYNC.user = null;
    SYNC.lastSync = 0;
    PUSHED.clear();
    setAcctDot('');
    renderAccount();
    toast('已退出 · 数据仍在这台设备上');
  });
}

function openAuth(){

/* ============================================================
   13.5 夜间模式
   切换结果记在 localStorage，下次打开还是这个模式
   ============================================================ */
const LS_THEME = 'wb_theme';

function applyTheme(pref){
  const sysDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  const dark = pref === 'dark' || (pref === 'auto' && sysDark);
  if (dark) document.documentElement.setAttribute('data-theme', 'dark');
  else document.documentElement.removeAttribute('data-theme');
  const m = document.getElementById('meta-theme');
  if (m) m.setAttribute('content', dark ? '#17150F' : '#F7F5F0');
  /* 在安卓壳里时，把系统状态栏 / 导航栏一起改色 */
  try {
    if (window.AndroidShell && window.AndroidShell.setDark) window.AndroidShell.setDark(!!dark);
  } catch(e){}
}

function readTheme(){
  let p = 'auto';
  try { p = localStorage.getItem(LS_THEME) || 'auto'; } catch(e){}
  return p;
}

document.getElementById('btn-theme').addEventListener('click', function(){
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const next = isDark ? 'light' : 'dark';
  try { localStorage.setItem(LS_THEME, next); } catch(e){}
  applyTheme(next);
  toast(next === 'dark' ? '夜间模式' : '日间模式');
});

/* 没手动选过时，跟着系统的深浅色走 */
try {
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const onSys = function(){ if (readTheme() === 'auto') applyTheme('auto'); };
  if (mq.addEventListener) mq.addEventListener('change', onSys);
  else if (mq.addListener) mq.addListener(onSys);
} catch(e){}
applyTheme(readTheme());

/* ---------- PWA：Service Worker 注册 + 安装提示 ---------- */
const IS_STANDALONE = window.matchMedia('(display-mode: standalone)').matches
  || window.navigator.standalone === true;

/* 被安卓套壳 App 打开时（外壳在网址后加了 app=1），切到 App 内布局 */
if (new URLSearchParams(location.search).get('app') === '1') {
  document.body.classList.add('in-app');
}

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  /* 本站资源都要带 sharecode 才放行，注册地址也带上 */
  const sc = new URLSearchParams(location.search).get('sharecode');
  navigator.serviceWorker.register('./sw.js' + (sc ? '?sharecode=' + sc : '')).catch(() => {});
}

/* 账号页里给出「安装到主屏幕」的提示（iOS 不支持自动安装弹窗，只能引导手势） */
function installTipHTML(){
  if (IS_STANDALONE) return '';
  const ua = navigator.userAgent || '';
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (ua.includes('Macintosh') && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/.test(ua);
  if (isIOS) {
    return '<p class="note-tip" style="color:var(--ink2)"><b>装成 App：</b>点 Safari 底部「分享」按钮 ↓，选「添加到主屏幕」，桌面就有图标，打开全屏无地址栏。</p>';
  }
  if (isAndroid) {
    return '<p class="note-tip" style="color:var(--ink2)"><b>装成 App：</b>浏览器菜单 ⋮ 里点「添加到主屏幕」或「安装应用」。</p>';
  }
  return '';
}
/* 把提示插进账号页两种渲染分支 */
const _ra = renderAccount;
renderAccount = function(){
  _ra();
  const body = document.getElementById('acct-body');
  if (body && !body.querySelector('.install-tip')) {
    body.insertAdjacentHTML('beforeend', '<div class="install-tip">' + installTipHTML() + '</div>');
  }
};
