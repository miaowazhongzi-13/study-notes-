apply plugin: 'com.android.application'

android {
    namespace 'com.quan.studynotes'
    compileSdk 36

    defaultConfig {
        applicationId 'com.quan.studynotes'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

/* 不引入任何第三方依赖：全部用系统 API，保证离线可编译 */
