<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>学习笔记</title>
<style>
  html, body{ margin:0; height:100%; }
  body{
    background:#F7F5F0; color:#1B1A17;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:32px;
  }
  .box{ max-width:320px; text-align:center; }
  .mark{
    width:64px; height:64px; margin:0 auto 26px;
    border-radius:18px; background:#1B1A17;
    display:flex; align-items:center; justify-content:center; gap:5px;
  }
  .mark i{ display:block; background:#F7F5F0; border-radius:2px; }
  .mark i:nth-child(1){ width:4px; height:26px; }
  .mark i:nth-child(2){ width:4px; height:26px; }
  .mark i:nth-child(3){ width:4px; height:16px; background:#C0492F; }
  h1{ font-size:19px; font-weight:600; margin:0 0 10px; letter-spacing:.01em; }
  p{ font-size:13.5px; line-height:1.7; color:#6E6A61; margin:0 0 30px; }
  a{
    display:inline-block; padding:13px 34px; border-radius:999px;
    background:#1B1A17; color:#F7F5F0; text-decoration:none;
    font-size:14.5px; font-weight:600; letter-spacing:.03em;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="mark"><i></i><i></i><i></i></div>
    <h1>现在连不上网</h1>
    <p>这个 App 的内容在云端，需要联网才能打开。<br>检查一下 Wi-Fi 或移动数据，再试一次。</p>
    <a href="app://retry">重新加载</a>
  </div>
</body>
</html>
