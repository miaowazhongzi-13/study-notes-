buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        /* 直接引用 AGP 的 jar，避免需要插件标记 artifact（离线环境里没有缓存） */
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
